<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mapa Beta 1</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #000;
}

#map {
  width: 100%;
  height: 100%;
}

/* Placa de velocidade */
#speed-limit {
  position: absolute;
  top: 20px;
  left: 15px;
  width: 90px;
  height: 90px;
  border-radius: 50%;
  border: 8px solid red;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: bold;
  z-index: 1000;
}

/* Velocidade atual */
#speed {
  position: absolute;
  top: 120px;
  left: 15px;
  padding: 8px 14px;
  background: rgba(0,0,0,0.7);
  color: #fff;
  border-radius: 10px;
  font-size: 18px;
  z-index: 1000;
}

/* Config */
#config {
  position: absolute;
  top: 15px;
  right: 15px;
  font-size: 28px;
  color: #fff;
  z-index: 1000;
}
</style>
</head>

<body>

<div id="map"></div>
<div id="speed-limit">50</div>
<div id="speed">0 km/h</div>
<div id="config">⚙️</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* =========================
   MAPA
========================= */
const map = L.map('map', {
  zoomControl: false
}).setView([-23.55052, -46.633308], 17);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

/* =========================
   ÍCONE JEEP (PNG EMBUTIDO)
========================= */
const jeepIcon = L.divIcon({
  html: `
    <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAB..." 
    style="width:60px;transform-origin:center center;" id="jeep">
  `,
  className: '',
  iconSize: [60, 60],
  iconAnchor: [30, 30]
});

let marker = L.marker(map.getCenter(), {
  icon: jeepIcon
}).addTo(map);

/* =========================
   VELOCIDADE
========================= */
let lastSpeed = 0;
let speedLimit = 50;

/* Simulação simples de tipo de via */
function getSpeedLimit(speed) {
  if (speed < 60) return 50;      // urbana
  if (speed < 90) return 80;      // via rápida
  if (speed < 110) return 100;    // estrada
  return 110;                     // rodovia
}

/* =========================
   GPS REAL
========================= */
navigator.geolocation.watchPosition(
  (pos) => {
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;
    const heading = pos.coords.heading || 0;

    let speed = pos.coords.speed
      ? pos.coords.speed * 3.6
      : lastSpeed;

    // Suavização
    speed = lastSpeed + (speed - lastSpeed) * 0.2;
    lastSpeed = speed;

    // Atualiza limite
    speedLimit = getSpeedLimit(speed);

    // Atualiza UI
    document.getElementById('speed').innerText =
      Math.round(speed) + ' km/h';

    document.getElementById('speed-limit').innerText =
      speedLimit;

    // Alerta excesso
    if (speed > speedLimit) {
      document.getElementById('speed-limit').style.background = 'red';
      document.getElementById('speed-limit').style.color = '#fff';
    } else {
      document.getElementById('speed-limit').style.background = 'white';
      document.getElementById('speed-limit').style.color = '#000';
    }

    // Atualiza posição
    marker.setLatLng([lat, lon]);
    map.setView([lat, lon], map.getZoom(), { animate: false });

    // Rotação do Jeep
    const jeep = document.getElementById('jeep');
    if (jeep) {
      jeep.style.transform = `rotate(${heading}deg)`;
    }
  },
  (err) => {
    console.error(err);
  },
  {
    enableHighAccuracy: true,
    maximumAge: 500,
    timeout: 10000
  }
);
</script>

</body>
</html>
