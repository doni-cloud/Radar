<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GPS Radar</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html,body{
margin:0;
padding:0;
height:100%;
font-family:Arial;
}

#map{
height:100%;
width:100%;
}

/* HUD */

#speedBox{
position:absolute;
top:12px;
left:12px;
background:black;
color:white;
padding:10px 18px;
border-radius:14px;
font-size:22px;
z-index:1000;
}

#limitBox{
position:absolute;
top:12px;
left:130px;
width:56px;
height:56px;
border-radius:50%;
border:5px solid red;
background:white;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
z-index:1000;
}

#radarAlert{
position:absolute;
top:12px;
right:12px;
width:200px;
background:#1b1b1b;
border:4px solid #2ecc71;
border-radius:14px;
color:white;
text-align:center;
padding:10px;
z-index:1000;
}

/* BOTÃO CONFIG */

#configBtn{
position:absolute;
bottom:20px;
right:20px;
width:60px;
height:60px;
border-radius:50%;
background:black;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
color:white;
cursor:pointer;
z-index:9999;
}

/* MENU */

#menu{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:#0e0e0e;
display:none;
z-index:2000;
padding:30px;
color:white;
}

.menuGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
margin-top:30px;
}

.menuBox{
background:#1b1b1b;
border-radius:16px;
padding:25px;
text-align:center;
font-size:18px;
cursor:pointer;
}

.menuBox.active{
background:#2ecc71;
}

#backBtn{
margin-top:40px;
background:#444;
padding:16px;
border-radius:12px;
text-align:center;
cursor:pointer;
}

</style>
</head>

<body>

<div id="map"></div>

<div id="speedBox">0 km/h</div>
<div id="limitBox">50</div>

<div id="radarAlert">
<h3>SEM RADAR</h3>
<hr>
<h3>RADAR À FRENTE</h3>
<h2>LIVRE</h2>
</div>

<div id="configBtn">⚙</div>

<div id="menu">

<h2>Configurações</h2>

<div class="menuGrid">

<div id="centerBtn" class="menuBox active">
Centralizar mapa
</div>

<div id="soundBtn" class="menuBox active">
Som Radar
</div>

<div id="testBtn" class="menuBox">
Testar Bip
</div>

<div id="themeBtn" class="menuBox">
Tema Escuro
</div>

</div>

<div id="backBtn">
Voltar
</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// MAPA (CORRIGIDO)
var map = L.map('map');

var lightMap = L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
  maxZoom:19,
  attribution:'© OpenStreetMap'
}
).addTo(map);

var darkMap = L.tileLayer(
'https://tiles.stadiamaps.com/tiles/alidade_dark/{z}/{x}/{y}{r}.png',
{
  maxZoom:19
}
);

// JEEP
const jeepIcon = L.divIcon({
className:'',
html:`<div style="width:40px;height:40px;background:black;border-radius:50%;border:3px solid red;"></div>`,
iconSize:[40,40],
iconAnchor:[20,20]
});

var marker = L.marker([0,0],{icon:jeepIcon}).addTo(map);

// CONTROLES
var center=true;
var sound=true;
var dark=false;

// GPS
navigator.geolocation.watchPosition(function(pos){

let lat = pos.coords.latitude;
let lon = pos.coords.longitude;
let speed = pos.coords.speed || 0;

// PRIMEIRA VEZ
if(!map._loaded){
  map.setView([lat,lon],17);
}

marker.setLatLng([lat,lon]);

let kmh = Math.round(speed*3.6);
document.getElementById("speedBox").innerText = kmh+" km/h";

if(center){
  map.setView([lat,lon],17);
}

},function(err){
console.log("Erro GPS:",err);
},{
enableHighAccuracy:true
});

// MENU
var menu=document.getElementById("menu");

document.getElementById("configBtn").onclick=function(){
menu.style.display="block";
};

document.getElementById("backBtn").onclick=function(){
menu.style.display="none";
};

// CENTRALIZAR
document.getElementById("centerBtn").onclick=function(){
center=!center;
this.classList.toggle("active");
};

// SOM
document.getElementById("soundBtn").onclick=function(){
sound=!sound;
this.classList.toggle("active");
};

// TESTE SOM
document.getElementById("testBtn").onclick=function(){
if(sound){
new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg").play();
}
};

// TEMA
document.getElementById("themeBtn").onclick=function(){
dark=!dark;

if(dark){
map.removeLayer(lightMap);
darkMap.addTo(map);
}else{
map.removeLayer(darkMap);
lightMap.addTo(map);
}
};

// CORREÇÃO FINAL
setTimeout(()=>{
map.invalidateSize();
},500);

</script>

</body>
</html>
