
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Navegação Jeep Beta 3</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #000;
  font-family: Arial, sans-serif;
}

#map {
  width: 100%;
  height: 100%;
}

/* HUD */
#hud {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 999;
}

#limit {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  border: 6px solid red;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: bold;
}

#speed {
  margin-top: 6px;
  background: #333;
  color: white;
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 16px;
  text-align: center;
}

/* Camera button */
#cameraBtn {
  position: absolute;
  bottom: 20px;
  right: 20px;
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: red;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  z-index: 999;
  color: white;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="hud">
  <div id="limit">50</div>
  <div id="speed">0 km/h</div>
</div>

<div id="cameraBtn">📷</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// =======================
// CONFIG
// =======================
let followMode = true;
let lastPos = null;
let lastTime = null;
let currentHeading = 0;

// limite simulado
let speedLimit = 50;

// =======================
// MAPA
// =======================
const map = L.map('map', {
  zoomControl: false,
  attributionControl: false
}).setView([0, 0], 18);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

// =======================
// SPRITE JEEP (estilo Uber)
// =======================
const jeepIcon = L.divIcon({
  className: '',
  html: `
<svg width="40" height="60" viewBox="0 0 40 60">
  <!-- Corpo -->
  <rect x="6" y="6" width="28" height="48" rx="8" fill="#111"/>

  <!-- Vidro -->
  <rect x="10" y="10" width="20" height="18" rx="4" fill="#222"/>

  <!-- Lanterna esquerda -->
  <rect x="8" y="34" width="6" height="8" rx="2" fill="#c00"/>
  <line x1="8" y1="34" x2="14" y2="42" stroke="#fff" stroke-width="1"/>
  <line x1="14" y1="34" x2="8" y2="42" stroke="#fff" stroke-width="1"/>

  <!-- Lanterna direita -->
  <rect x="26" y="34" width="6" height="8" rx="2" fill="#c00"/>
  <line x1="26" y1="34" x2="32" y2="42" stroke="#fff" stroke-width="1"/>
  <line x1="32" y1="34" x2="26" y2="42" stroke="#fff" stroke-width="1"/>

  <!-- Para-choque -->
  <rect x="10" y="48" width="20" height="4" rx="2" fill="#333"/>
</svg>
`,
  iconSize: [40, 60],
  iconAnchor: [20, 30]
});

const jeepMarker = L.marker([0, 0], {
  icon: jeepIcon,
  rotationAngle: 0
}).addTo(map);

// =======================
// BOTÃO CÂMERA
// =======================
const camBtn = document.getElementById('cameraBtn');

camBtn.onclick = () => {
  followMode = !followMode;
  camBtn.style.background = followMode ? 'red' : 'green';
};

// =======================
// GPS
// =======================
navigator.geolocation.watchPosition(pos => {
  const lat = pos.coords.latitude;
  const lng = pos.coords.longitude;
  const heading = pos.coords.heading || currentHeading;

  // suavização
  currentHeading = heading;

  jeepMarker.setLatLng([lat, lng]);

  // rotação visual
  jeepMarker.getElement().style.transform =
    `rotate(${heading}deg)`;

  if (followMode) {
    map.setView([lat, lng], map.getZoom(), {
      animate: true,
      duration: 0.5
    });
    map.getPane('mapPane').style.transform =
      `rotate(${-heading}deg)`;
  }

  // velocidade
  if (lastPos && lastTime) {
    const dist = map.distance(lastPos, [lat, lng]);
    const timeDiff = (Date.now() - lastTime) / 1000;
    const speed = (dist / timeDiff) * 3.6;

    document.getElementById('speed').innerText =
      speed.toFixed(0) + ' km/h';

    if (speed > speedLimit) {
      document.getElementById('limit').style.background = 'red';
      document.getElementById('limit').style.color = 'white';
    } else {
      document.getElementById('limit').style.background = 'white';
      document.getElementById('limit').style.color = 'black';
    }
  }

  lastPos = [lat, lng];
  lastTime = Date.now();

}, err => {
  alert("Erro GPS");
}, {
  enableHighAccuracy: true,
  maximumAge: 500,
  timeout: 10000
});
</script>

</body>
</html>
