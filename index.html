<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>GPS Jeep Renegade – Beta 3.2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
  margin: 0;
  height: 100%;
  background: #111;
}

#map {
  width: 100%;
  height: 100%;
}

/* LIMITE */
#limitBox {
  position: absolute;
  top: 12px;
  left: 12px;
  width: 78px;
  height: 78px;
  border-radius: 50%;
  border: 6px solid red;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  font-weight: bold;
  z-index: 1000;
}

/* VELOCIDADE */
#speedBox {
  position: absolute;
  top: 100px;
  left: 22px;
  background: #111;
  color: white;
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 18px;
  z-index: 1000;
}

/* BOTÃO CAMERA */
#freeCam {
  position: absolute;
  right: 16px;
  bottom: 20px;
  width: 56px;
  height: 56px;
  background: red;
  color: white;
  border-radius: 50%;
  font-size: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="map"></div>
<div id="limitBox">50</div>
<div id="speedBox">0 km/h</div>
<div id="freeCam">📷</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* MAPA */
const map = L.map('map', { zoomControl: false }).setView([0,0], 18);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

/* CONFIG */
let followGPS = true;
let speedLimit = 50;
let speedBuffer = [];
let jeepMarker = null;
let lastPos = null;
let lastHeading = 0;

/* ICON JEEP (ROTACIONÁVEL) */
const jeepIcon = L.divIcon({
  className: '',
  html: `
  <div id="jeep" style="
    width:48px;
    height:70px;
    transform-origin:50% 50%;
    transition: transform 0.25s linear;
  ">
    <svg width="48" height="70" viewBox="0 0 48 70">
      <ellipse cx="24" cy="66" rx="16" ry="4" fill="rgba(0,0,0,0.45)"/>
      <rect x="8" y="10" width="32" height="42" rx="9" fill="#0b0b0b"/>
      <rect x="12" y="4" width="24" height="12" rx="6" fill="#111"/>
      <rect x="15" y="8" width="18" height="8" rx="3" fill="#1c1c1c"/>
      <circle cx="14" cy="46" r="3.2" fill="#ff2a2a"/>
      <circle cx="34" cy="46" r="3.2" fill="#ff2a2a"/>
    </svg>
  </div>
  `,
  iconSize: [48,70],
  iconAnchor: [24,35]
});

/* BOTÃO CAMERA */
freeCam.onclick = () => {
  followGPS = !followGPS;
  freeCam.style.background = followGPS ? "red" : "green";
};

/* FUNÇÕES */
function calcularDirecao(lat1, lon1, lat2, lon2) {
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
  const x =
    Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
    Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

function suavizarAngulo(atual, alvo) {
  let diff = ((alvo - atual + 540) % 360) - 180;
  return atual + diff * 0.25;
}

/* GPS */
navigator.geolocation.watchPosition(pos => {
  const lat = pos.coords.latitude;
  const lng = pos.coords.longitude;
  const rawSpeed = pos.coords.speed ? pos.coords.speed * 3.6 : 0;

  speedBuffer.push(rawSpeed);
  if (speedBuffer.length > 6) speedBuffer.shift();
  const speed = speedBuffer.reduce((a,b)=>a+b,0) / speedBuffer.length;

  speedBox.innerText = Math.round(speed) + " km/h";
  limitBox.style.background = speed > speedLimit ? "red" : "white";
  limitBox.style.color = speed > speedLimit ? "white" : "black";

  if (jeepMarker) jeepMarker.setLatLng([lat,lng]);
  else jeepMarker = L.marker([lat,lng], { icon: jeepIcon, interactive:false }).addTo(map);

  if (lastPos) {
    const ang = calcularDirecao(lastPos.lat, lastPos.lng, lat, lng);
    lastHeading = suavizarAngulo(lastHeading, ang);

    const jeepEl = document.getElementById("jeep");
    if (jeepEl) jeepEl.style.transform = `rotate(${lastHeading}deg)`;
  }

  lastPos = { lat, lng };

  if (followGPS) map.setView([lat,lng], map.getZoom(), { animate:false });

}, err => alert("Erro GPS: " + err.message), {
  enableHighAccuracy: true,
  timeout: 10000
});
</script>

</body>
</html>
