<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body{
margin:0;
font-family:Arial;
}

#map{
height:100vh;
width:100%;
}

/* velocidade */

#speedBox{
position:absolute;
bottom:20px;
left:20px;
background:#111;
color:white;
padding:10px 14px;
border-radius:10px;
font-size:22px;
z-index:1000;
}

/* limite via */

#limitBox{
position:absolute;
bottom:20px;
left:110px;
background:#fff;
border:3px solid red;
color:black;
padding:8px;
border-radius:50%;
font-weight:bold;
z-index:1000;
}

/* botão config */

#configBtn{
position:absolute;
top:20px;
right:20px;
background:#111;
color:white;
border:none;
padding:10px 12px;
border-radius:8px;
z-index:1000;
}

/* menu */

#menu{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
display:none;
z-index:2000;
color:white;
padding:30px;
}

.menuButton{
padding:10px;
margin-top:10px;
border-radius:8px;
border:none;
font-size:16px;
}

.green{
background:green;
color:white;
}

.red{
background:red;
color:white;
}

/* radar */

#radarAlert{
position:absolute;
top:150px;
left:20px;
background:#111;
color:white;
padding:14px 18px;
border-radius:14px;
border-left:6px solid red;
z-index:1000;
display:none;
}

.radarTitle{
font-size:14px;
opacity:0.8;
}

.radarText{
font-size:20px;
font-weight:bold;
margin-top:4px;
}

#radarDistance{
font-size:26px;
font-weight:bold;
margin-top:6px;
color:#ff4444;
}

</style>

</head>

<body>

<div id="map"></div>

<div id="speedBox">0 km/h</div>
<div id="limitBox">60</div>

<button id="configBtn">⚙</button>

<div id="radarAlert">
<div class="radarTitle">📡 RADAR</div>
<div class="radarText">⚠ RADAR A FRENTE</div>
<div id="radarDistance">500 m</div>
</div>

<div id="menu">

<h2>Configurações</h2>

<button id="soundToggle" class="menuButton green">
Som Ativado
</button>

<button id="testSound" class="menuButton">
Teste Bip
</button>

<button id="cameraMode" class="menuButton green">
Câmera Focada
</button>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let map = L.map('map').setView([-22.3145,-49.0602],17);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19
}).addTo(map);

let jeepIcon = L.divIcon({
html:"🚙",
iconSize:[30,30]
});

let jeepMarker = null;

let lastLat = null;
let lastLng = null;

let soundOn = true;
let cameraFocus = true;

let radarLat = -22.3145;
let radarLng = -49.0615;

let lastBeep500=false;
let lastBeep250=false;
let lastBeep80=false;

let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function beep(freq,duration){

if(!soundOn) return;

let osc = audioCtx.createOscillator();
let gain = audioCtx.createGain();

osc.connect(gain);
gain.connect(audioCtx.destination);

osc.frequency.value = freq;

osc.start();

setTimeout(()=>{
osc.stop();
},duration);

}

function getDistance(lat1,lon1,lat2,lon2){

const R=6371000;

const dLat=(lat2-lat1)*Math.PI/180;
const dLon=(lon2-lon1)*Math.PI/180;

const a=
Math.sin(dLat/2)*Math.sin(dLat/2)+
Math.cos(lat1*Math.PI/180)*
Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)*Math.sin(dLon/2);

const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));

return R*c;

}

function smoothMove(lat,lng){

if(!jeepMarker){

jeepMarker=L.marker([lat,lng],{icon:jeepIcon}).addTo(map);
return;

}

let start=jeepMarker.getLatLng();

let steps=20;
let i=0;

let move=setInterval(()=>{

i++;

let newLat=start.lat+(lat-start.lat)*(i/steps);
let newLng=start.lng+(lng-start.lng)*(i/steps);

jeepMarker.setLatLng([newLat,newLng]);

if(i>=steps) clearInterval(move);

},50);

}

navigator.geolocation.watchPosition(pos=>{

let lat=pos.coords.latitude;
let lng=pos.coords.longitude;

let speed=pos.coords.speed;

if(speed==null) speed=0;

speed=Math.round(speed*3.6);

document.getElementById("speedBox").innerText=speed+" km/h";

smoothMove(lat,lng);

if(cameraFocus){
map.setView([lat,lng]);
}

let dist=getDistance(lat,lng,radarLat,radarLng);

let radarBox=document.getElementById("radarAlert");
let radarDist=document.getElementById("radarDistance");

if(dist<=500){

radarBox.style.display="block";

radarDist.innerText=Math.round(dist)+" m";

if(dist<500 && !lastBeep500){

beep(900,120);

lastBeep500=true;

}

if(dist<250 && !lastBeep250){

beep(1200,120);

lastBeep250=true;

}

if(dist<80 && !lastBeep80){

beep(2000,300);

lastBeep80=true;

}

}else{

radarBox.style.display="none";

lastBeep500=false;
lastBeep250=false;
lastBeep80=false;

}

lastLat=lat;
lastLng=lng;

});

document.getElementById("configBtn").onclick=()=>{

let menu=document.getElementById("menu");

menu.style.display=menu.style.display=="block"?"none":"block";

};

document.getElementById("soundToggle").onclick=function(){

soundOn=!soundOn;

this.innerText=soundOn?"Som Ativado":"Som Desativado";

this.className="menuButton "+(soundOn?"green":"red");

};

document.getElementById("testSound").onclick=()=>{

beep(1200,200);

};

document.getElementById("cameraMode").onclick=function(){

cameraFocus=!cameraFocus;

this.innerText=cameraFocus?"Câmera Focada":"Câmera Livre";

this.className="menuButton "+(cameraFocus?"green":"red");

};

</script>

</body>
</html>
