
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>GPS Radar Beta</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Leaflet -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #000;
  overflow: hidden;
}

/* MAPA REAL */
#map {
  width: 100%;
  height: 100%;
}

/* SETA */
#arrow {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  border-left: 16px solid transparent;
  border-right: 16px solid transparent;
  border-bottom: 36px solid #00ffd5;
  transform: translate(-50%, -50%) rotate(0deg);
  z-index: 999;
  transition: transform 0.2s linear;
}

/* VELOCIDADE */
#speedBox {
  position: absolute;
  left: 10px;
  bottom: 50%;
  background: rgba(0,0,0,0.75);
  color: #fff;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 20px;
  font-family: Arial, sans-serif;
  z-index: 999;
}

/* CONFIG */
#configBtn {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 26px;
  color: #fff;
  z-index: 999;
}
</style>
</head>

<body>

<div id="map"></div>
<div id="arrow"></div>
<div id="speedBox">0 km/h</div>
<div id="configBtn">⚙️</div>

<script>
/* MAPA */
var map = L.map('map', {
  zoomControl: false,
  attributionControl: false
}).setView([0, 0], 17);

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  { maxZoom: 19 }
).addTo(map);

/* GPS */
var firstFix = true;

navigator.geolocation.watchPosition(
  function (pos) {
    var lat = pos.coords.latitude;
    var lon = pos.coords.longitude;
    var speed = pos.coords.speed;
    var heading = pos.coords.heading;

    if (firstFix) {
      map.setView([lat, lon], 17);
      firstFix = false;
    } else {
      map.panTo([lat, lon], { animate: false });
    }

    if (speed !== null) {
      var kmh = Math.max(0, speed * 3.6).toFixed(0);
      document.getElementById("speedBox").innerText = kmh + " km/h";
    }

    if (heading !== null) {
      document.getElementById("arrow").style.transform =
        "translate(-50%, -50%) rotate(" + heading + "deg)";
    }
  },
  function (err) {
    alert("Erro GPS: " + err.message);
  },
  {
    enableHighAccuracy: true,
    maximumAge: 0,
    timeout: 10000
  }
);
</script>

</body>
</html>
