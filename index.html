<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Radar Teste</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body, #map {
  margin: 0;
  width: 100%;
  height: 100%;
}

/* LIMITE */
#limitBox {
  position: absolute;
  top: 12px;
  left: 12px;
  width: 78px;
  height: 78px;
  border-radius: 50%;
  border: 6px solid red;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  font-weight: bold;
  z-index: 1000;
}

/* VELOCIDADE */
#speedBox {
  position: absolute;
  top: 100px;
  left: 22px;
  background: #111;
  color: white;
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 18px;
  z-index: 1000;
}

/* BOTÃO CÂMERA */
#freeCam {
  position: absolute;
  right: 16px;
  bottom: 20px;
  width: 56px;
  height: 56px;
  background: red;
  color: white;
  border-radius: 50%;
  font-size: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="map"></div>
<div id="limitBox">50</div>
<div id="speedBox">0 km/h</div>
<div id="freeCam">📷</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* MAPA */
const map = L.map('map', { zoomControl: false }).setView([-22.33287, -49.05661], 18);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

let followGPS = true;
let jeepMarker = null;

/* ÍCONE DO CARRO (INALTERADO) */
const jeepIcon = L.divIcon({
  className: '',
  html: `
  <div style="width:26px;height:40px;background:#111;border-radius:8px;position:relative">
    <div style="position:absolute;bottom:-6px;left:6px;width:14px;height:6px;background:#555;border-radius:3px"></div>
    <div style="position:absolute;bottom:6px;left:4px;width:6px;height:6px;background:red;border-radius:50%"></div>
    <div style="position:absolute;bottom:6px;right:4px;width:6px;height:6px;background:red;border-radius:50%"></div>
  </div>
  `,
  iconSize: [26,40],
  iconAnchor: [13,20]
});

/* 🔴 ÍCONE DE RADAR (SEM FUNDO – IGUAL AO SEU) */
const radarIcon = L.divIcon({
  className: '',
  html: `
  <img src="radar.png" style="width:32px;height:32px">
  `,
  iconSize: [32,32],
  iconAnchor: [16,16]
});

/* 📍 RADAR NA LOCALIZAÇÃO CERTA */
L.marker([-22.33287, -49.05661], {
  icon: radarIcon,
  interactive: false
}).addTo(map);

/* GPS */
navigator.geolocation.watchPosition(pos => {
  const lat = pos.coords.latitude;
  const lng = pos.coords.longitude;
  const speed = pos.coords.speed ? pos.coords.speed * 3.6 : 0;

  speedBox.innerText = Math.round(speed) + " km/h";

  if (jeepMarker) map.removeLayer(jeepMarker);
  jeepMarker = L.marker([lat,lng], { icon: jeepIcon }).addTo(map);

  if (followGPS) {
    map.setView([lat,lng], map.getZoom(), { animate: false });
  }
});

/* BOTÃO CÂMERA – NÃO ALTERADO */
freeCam.onclick = () => {
  followGPS = !followGPS;
  freeCam.style.background = followGPS ? "red" : "green";
};
</script>

</body>
</html>
