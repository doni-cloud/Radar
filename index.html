<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa GPS Beta 2</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: black;
}

#map {
  width: 100%;
  height: 100%;
}

#speedBox {
  position: absolute;
  left: 12px;
  top: 12px;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: white;
  border: 6px solid red;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  font-weight: bold;
  z-index: 999;
}

#settings {
  position: absolute;
  right: 14px;
  top: 14px;
  font-size: 26px;
  background: rgba(0,0,0,0.6);
  color: white;
  padding: 10px;
  border-radius: 50%;
  z-index: 999;
}
</style>
</head>

<body>

<div id="map"></div>
<div id="speedBox">0</div>
<div id="settings">⚙️</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// =================== MAPA ===================
const map = L.map('map').setView([0, 0], 18);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

// =================== LIMITES ===================
let speedLimit = 50; // urbano
const speedBox = document.getElementById("speedBox");

// =================== ICONES BASE64 ===================

// Radar
const radarIcon = L.icon({
  iconUrl: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAYAAABXAvmHAAA...",
  iconSize: [36,36],
  iconAnchor: [18,18]
});

// Semáforo
const semaforoIcon = L.icon({
  iconUrl: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAYAAABXAvmHAAA...",
  iconSize: [36,36],
  iconAnchor: [18,18]
});

// Jeep (seta carro)
const jeepIcon = L.divIcon({
  className: '',
  html: '<div id="jeep" style="width:30px;height:30px;background:black;border-radius:6px;transform:rotate(0deg)"></div>',
  iconSize: [30,30],
  iconAnchor: [15,15]
});

// =================== MARKERS FIXOS ===================
L.marker([-23.5505, -46.6333], {icon: radarIcon}).addTo(map);
L.marker([-23.5512, -46.6325], {icon: semaforoIcon}).addTo(map);

// =================== AUDIO ===================
const beepRadar = new Audio("data:audio/mp3;base64,//uQxAA...");
const beepSemaforo = new Audio("data:audio/mp3;base64,//uQxAA...");

// =================== GPS ===================
let jeepMarker = null;
let lastPosition = null;

navigator.geolocation.watchPosition(pos => {
  const lat = pos.coords.latitude;
  const lng = pos.coords.longitude;
  const speed = pos.coords.speed ? (pos.coords.speed * 3.6) : 0;

  speedBox.innerText = Math.round(speed);

  if (speed > speedLimit) {
    speedBox.style.background = "red";
    speedBox.style.color = "white";
  } else {
    speedBox.style.background = "white";
    speedBox.style.color = "black";
  }

  if (!jeepMarker) {
    jeepMarker = L.marker([lat, lng], {icon: jeepIcon}).addTo(map);
    map.setView([lat, lng], 18);
  } else {
    jeepMarker.setLatLng([lat, lng]);
    map.panTo([lat, lng]);
  }

  lastPosition = {lat, lng};

}, err => {
  alert("Erro GPS: " + err.message);
}, {
  enableHighAccuracy: true,
  maximumAge: 1000,
  timeout: 10000
});
</script>

</body>
</html>
