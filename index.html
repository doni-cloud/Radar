
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Radar SP – Beta 2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #000;
}

#map {
  height: 100%;
  width: 100%;
}

/* Velocidade */
#speedBox {
  position: absolute;
  left: 15px;
  top: 60px;
  background: rgba(0,0,0,0.75);
  color: #fff;
  padding: 10px 16px;
  border-radius: 10px;
  font-size: 20px;
  font-weight: bold;
  z-index: 999;
}

/* Config */
#configBtn {
  position: absolute;
  top: 15px;
  right: 15px;
  font-size: 26px;
  color: #fff;
  z-index: 999;
  cursor: pointer;
}

#configPanel {
  position: absolute;
  top: 0;
  right: 0;
  width: 260px;
  height: 100%;
  background: #111;
  color: #fff;
  padding: 20px;
  display: none;
  z-index: 1000;
}

/* Seta */
.arrow {
  width: 0;
  height: 0;
  border-left: 15px solid transparent;
  border-right: 15px solid transparent;
  border-bottom: 30px solid #00ffd5;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="speedBox">0 km/h</div>
<div id="configBtn">⚙️</div>

<div id="configPanel">
  <h3>Configurações</h3>
  <p>(em desenvolvimento)</p>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const map = L.map('map', {
  zoomControl: false
}).setView([-23.5505, -46.6333], 17);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

// Ícone da seta
const arrowIcon = L.divIcon({
  className: '',
  html: '<div class="arrow"></div>',
  iconSize: [30, 30],
  iconAnchor: [15, 15]
});

let marker = L.marker([-23.5505, -46.6333], {
  icon: arrowIcon
}).addTo(map);

let lastSpeed = 0;

if ("geolocation" in navigator) {
  navigator.geolocation.watchPosition(
    pos => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const heading = pos.coords.heading || 0;
      const speed = pos.coords.speed ? pos.coords.speed * 3.6 : lastSpeed;

      lastSpeed = speed;

      marker.setLatLng([lat, lon]);
      map.setView([lat, lon]);

      const el = marker.getElement();
      if (el) {
        el.style.transform = `rotate(${heading}deg)`;
      }

      document.getElementById("speedBox").innerText =
        Math.round(speed) + " km/h";
    },
    err => {
      alert("Ative a localização (GPS)");
    },
    {
      enableHighAccuracy: true,
      maximumAge: 500,
      timeout: 10000
    }
  );
}

// Config botão
const btn = document.getElementById("configBtn");
const panel = document.getElementById("configPanel");

btn.onclick = () => {
  panel.style.display = panel.style.display === "block" ? "none" : "block";
};
</script>

</body>
</html>
