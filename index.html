<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GPS Radar</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html,body{
margin:0;
padding:0;
height:100%;
font-family:Arial;
}

#map{
height:100%;
width:100%;
}

/* HUD */

#speedBox{
position:absolute;
top:12px;
left:12px;
background:black;
color:white;
padding:10px 18px;
border-radius:14px;
font-size:22px;
z-index:1000;
pointer-events:none;
}

#limitBox{
position:absolute;
top:12px;
left:130px;
width:56px;
height:56px;
border-radius:50%;
border:5px solid red;
background:white;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
z-index:1000;
pointer-events:none;
}

#radarAlert{
position:absolute;
top:12px;
right:12px;
width:200px;
background:#1b1b1b;
border:4px solid #2ecc71;
border-radius:14px;
color:white;
text-align:center;
padding:10px;
z-index:1000;
pointer-events:none;
}

/* BOTÃO CONFIG */

#configBtn{
position:absolute;
bottom:20px;
right:20px;
width:60px;
height:60px;
border-radius:50%;
background:black;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
color:white;
cursor:pointer;
z-index:5000;
pointer-events:auto;
}

/* MENU */

#menu{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:#0e0e0e;
display:none;
z-index:6000;
padding:30px;
color:white;
}

.menuGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
margin-top:30px;
}

.menuBox{
background:#1b1b1b;
border-radius:16px;
padding:25px;
text-align:center;
font-size:18px;
cursor:pointer;
}

.menuBox.active{
background:#2ecc71;
}

#backBtn{
margin-top:40px;
background:#444;
padding:16px;
border-radius:12px;
text-align:center;
cursor:pointer;
}

</style>
</head>

<body>

<div id="map"></div>

<div id="speedBox">0 km/h</div>
<div id="limitBox">60</div>

<div id="radarAlert">
<h3>SEM RADAR</h3>
<hr>
<h3>RADAR À FRENTE</h3>
<h2>LIVRE</h2>
</div>

<div id="configBtn">⚙</div>

<div id="menu">

<h2>Configurações</h2>

<div class="menuGrid">

<div id="centerBtn" class="menuBox">
Centralizar mapa
</div>

<div id="soundBtn" class="menuBox active">
Som Radar
</div>

<div id="testBtn" class="menuBox">
Testar Bip
</div>

<div id="themeBtn" class="menuBox">
Tema Escuro
</div>

</div>

<div id="backBtn">
Voltar
</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* MAPA */

var map = L.map('map',{zoomControl:false}).setView([-22.3145,-49.0604],17);

var lightMap = L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{maxZoom:19}
).addTo(map);

var darkMap = L.tileLayer(
'https://tiles.stadiamaps.com/tiles/alidade_dark/{z}/{x}/{y}{r}.png',
{maxZoom:19}
);

/* JEEP */

const jeepIcon = L.divIcon({
className:'',
html:`
<div style="position:relative;width:48px;height:70px;">
<svg width="48" height="70" viewBox="0 0 48 70">

<ellipse cx="24" cy="66" rx="16" ry="4" fill="rgba(0,0,0,0.45)"/>

<rect x="8" y="10" width="32" height="42" rx="9" fill="#0b0b0b"/>
<rect x="12" y="4" width="24" height="12" rx="6" fill="#111"/>

<rect x="15" y="8" width="18" height="8" rx="3" fill="#1c1c1c"/>

<circle cx="14" cy="46" r="3.2" fill="#ff2a2a"/>
<circle cx="34" cy="46" r="3.2" fill="#ff2a2a"/>

<rect x="18" y="50" width="12" height="5" rx="1.5" fill="#ccc"/>

</svg>
</div>
`,
iconSize:[48,70],
iconAnchor:[24,35]
});

var marker = L.marker([-22.3145,-49.0604],{
icon:jeepIcon
}).addTo(map);


/* CONTROLES */

var center=true;
var sound=true;
var dark=false;


/* GPS */

navigator.geolocation.watchPosition(function(pos){

var lat=pos.coords.latitude;
var lon=pos.coords.longitude;
var speed=pos.coords.speed||0;

marker.setLatLng([lat,lon]);

var kmh=Math.round(speed*3.6);
document.getElementById("speedBox").innerText=kmh+" km/h";

/* FORÇA SEGUIR CARRO */

if(center){
map.flyTo([lat,lon],17,{animate:false});
}

},{
enableHighAccuracy:true,
maximumAge:0,
timeout:10000
});


/* MENU */

var menu=document.getElementById("menu");

document.getElementById("configBtn").addEventListener("click",function(e){

e.stopPropagation();

menu.style.display="block";

/* trava mapa */
map.dragging.disable();
map.touchZoom.disable();
map.scrollWheelZoom.disable();

});


document.getElementById("backBtn").onclick=function(){

menu.style.display="none";

/* destrava mapa */
map.dragging.enable();
map.touchZoom.enable();
map.scrollWheelZoom.enable();

};


/* MAPA LIVRE */

document.getElementById("centerBtn").onclick=function(){

center=!center;

if(center){
this.classList.add("active");
}else{
this.classList.remove("active");
}

}


/* SOM */

document.getElementById("soundBtn").onclick=function(){

sound=!sound;

if(sound){
this.classList.add("active");
}else{
this.classList.remove("active");
}

}


/* TESTAR BIP */

document.getElementById("testBtn").onclick=function(){

if(sound){
var audio=new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
audio.play();
}

}


/* TEMA MAPA */

document.getElementById("themeBtn").onclick=function(){

dark=!dark;

if(dark){

map.removeLayer(lightMap);
darkMap.addTo(map);

}else{

map.removeLayer(darkMap);
lightMap.addTo(map);

}

}

</script>

</body>
</html>
