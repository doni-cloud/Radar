<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>GPS Jeep Renegade – Beta Estável</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html, body {
  margin:0;
  height:100%;
  background:#111;
}

#map{
  width:100%;
  height:100%;
}

/* VELOCIDADE */
#speedBox{
position:absolute;
top:18px;
left:18px;
background:black;
color:white;
padding:14px 24px;
border-radius:16px;
font-size:28px;
z-index:1000;
}

/* LIMITE DA VIA */

#limitBox{
position:absolute;
top:18px;
left:180px;
width:70px;
height:70px;
border-radius:50%;
border:6px solid red;
background:white;
display:flex;
align-items:center;
justify-content:center;
font-size:26px;
font-weight:bold;
z-index:1000;
}

/* BOTÃO CÂMERA */

#freeCam{
position:absolute;
right:18px;
bottom:22px;
width:60px;
height:60px;
border-radius:50%;
background:red;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
z-index:1000;
}

/* ALERTA RADAR */

#radarAlert{

position:absolute;
top:110px;
left:50%;
transform:translateX(-50%);
width:280px;

background:#1b1b1b;
border:5px solid #ffc400;
border-radius:18px;

text-align:center;

padding:18px;

display:none;

z-index:1000;

}

.radarTitle{

color:white;
font-size:20px;
font-weight:bold;

}

.radarLine{

height:3px;
background:#ffc400;
margin:10px 0;

}

.radarSub{

color:white;
font-size:22px;
font-weight:bold;

}

.radarDistance{

color:white;
font-size:42px;
font-weight:bold;

}

/* FUMAÇA JEEP */

@keyframes smoke {
from {opacity:0.6; transform:translate(0,0) scale(1);}
to {opacity:0; transform:translate(-12px,12px) scale(1.7);}
}

.smoke{
position:absolute;
width:10px;
height:10px;
background:rgba(200,200,200,0.6);
border-radius:50%;
animation:smoke 1s linear infinite;
}

</style>
</head>

<body>

<div id="map"></div>

<div id="speedBox">0 km/h</div>
<div id="limitBox">60</div>

<div id="freeCam">📷</div>

<!-- ALERTA RADAR -->

<div id="radarAlert">

<div class="radarTitle">RADAR DETECTADO</div>

<div class="radarLine"></div>

<div class="radarSub">RADAR À FRENTE</div>

<div class="radarLine"></div>

<div class="radarDistance" id="radarDistance">
Esperando detecção
</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* MAPA */

const map = L.map('map',{zoomControl:false}).setView([0,0],18)

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19
}).addTo(map)


/* CONFIG */

let followGPS = true
let speedLimit = 60
let speedBuffer = []
let jeepMarker = null


/* JEEP */

const jeepIcon = L.divIcon({

className:'',
html:`

<div style="position:relative;width:48px;height:70px;">

<svg width="48" height="70" viewBox="0 0 48 70">

<ellipse cx="24" cy="66" rx="16" ry="4" fill="rgba(0,0,0,0.45)"/>

<rect x="8" y="10" width="32" height="42" rx="9" fill="#0b0b0b"/>

<rect x="12" y="4" width="24" height="12" rx="6" fill="#111"/>

<rect x="15" y="8" width="18" height="8" rx="3" fill="#1c1c1c"/>

<circle cx="14" cy="46" r="3.2" fill="#ff2a2a"/>

<circle cx="34" cy="46" r="3.2" fill="#ff2a2a"/>

<rect x="18" y="50" width="12" height="5" rx="1.5" fill="#ccc"/>

</svg>

<div class="smoke" style="left:10px;bottom:4px"></div>
<div class="smoke" style="right:10px;bottom:4px;animation-delay:.3s"></div>

</div>

`,
iconSize:[48,70],
iconAnchor:[24,35]

})


/* BOTÃO CAMERA */

document.getElementById("freeCam").onclick=()=>{

followGPS=!followGPS
freeCam.style.background = followGPS ? "red" : "green"

}


/* SOM RADAR */

function bipRadar(){

let ctx = new (window.AudioContext || window.webkitAudioContext)()

let osc = ctx.createOscillator()

let gain = ctx.createGain()

osc.frequency.value = 900

gain.gain.value = 0.2

osc.connect(gain)
gain.connect(ctx.destination)

osc.start()
osc.stop(ctx.currentTime+0.15)

}


/* MOSTRAR RADAR */

function mostrarRadar(dist){

document.getElementById("radarAlert").style.display="block"

document.getElementById("radarDistance").innerText = dist + " m"

bipRadar()

}


/* GPS */

navigator.geolocation.watchPosition(pos=>{

const lat = pos.coords.latitude
const lng = pos.coords.longitude
const rawSpeed = pos.coords.speed ? pos.coords.speed*3.6 : 0

speedBuffer.push(rawSpeed)
if(speedBuffer.length>6) speedBuffer.shift()

const speed = speedBuffer.reduce((a,b)=>a+b,0)/speedBuffer.length

speedBox.innerText = Math.round(speed)+" km/h"

if(speed>speedLimit){

limitBox.style.background="red"
limitBox.style.color="white"

}else{

limitBox.style.background="white"
limitBox.style.color="black"

}

/* jeep */

if(jeepMarker) map.removeLayer(jeepMarker)

jeepMarker = L.marker([lat,lng],{

icon:jeepIcon,
interactive:false

}).addTo(map)

if(followGPS){

map.setView([lat,lng],map.getZoom(),{animate:false})

}

},err=>alert(err.message),{

enableHighAccuracy:true

})


/* TESTE RADAR */

setTimeout(()=>{

mostrarRadar(500)

},4000)

</script>

</body>
</html>
