<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GPS Radar</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html,body{
margin:0;
padding:0;
height:100%;
font-family:Arial;
}

#map{
height:100%;
width:100%;
}

/* VELOCÍMETRO */

#speedBox{
position:absolute;
top:12px;
left:12px;
background:black;
color:white;
padding:10px 18px;
border-radius:14px;
font-size:22px;
z-index:1000;
}

/* LIMITE VIA */

#limitBox{
position:absolute;
top:12px;
left:130px;
width:56px;
height:56px;
border-radius:50%;
border:5px solid red;
background:white;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
z-index:1000;
}

/* ALERTA RADAR */

#radarAlert{
position:absolute;
top:12px;
right:12px;
width:200px;
background:#1b1b1b;
border:4px solid #ffc400;
border-radius:14px;
color:white;
text-align:center;
padding:10px;
z-index:1000;
}

#radarAlert h3{
margin:4px;
font-size:14px;
}

#radarAlert h2{
margin:6px;
font-size:28px;
}

/* CONFIGURAÇÃO */

#configBtn{
position:absolute;
bottom:20px;
right:20px;
width:60px;
height:60px;
border-radius:50%;
background:black;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
color:white;
cursor:pointer;
z-index:1000;
box-shadow:0 3px 8px rgba(0,0,0,0.5);
}

/* MENU */

#menu{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:#111;
color:white;
display:none;
z-index:2000;
padding:30px;
}

.menuItem{
padding:14px;
margin:12px 0;
border-radius:10px;
font-size:20px;
cursor:pointer;
}

.active{
background:green;
}

.off{
background:red;
}

#backBtn{
margin-top:30px;
background:#444;
padding:14px;
border-radius:10px;
text-align:center;
cursor:pointer;
}

</style>
</head>

<body>

<div id="map"></div>

<!-- VELOCIDADE -->

<div id="speedBox">
0 km/h
</div>

<!-- LIMITE VIA -->

<div id="limitBox">
60
</div>

<!-- ALERTA RADAR -->

<div id="radarAlert">

<h3>📡 RADAR DETECTADO</h3>
<hr>
<h3>⚠ RADAR À FRENTE</h3>
<h2 id="radarDist">500 m</h2>

</div>

<!-- BOTÃO CONFIG -->

<div id="configBtn">
⚙
</div>

<!-- MENU -->

<div id="menu">

<h2>Configurações</h2>

<div id="soundBtn" class="menuItem active">
Som Radar: ATIVO
</div>

<div id="centerBtn" class="menuItem off">
Centralizar mapa
</div>

<div id="freeBtn" class="menuItem active">
Modo livre
</div>

<div id="backBtn">
Voltar
</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* MAPA */

var map = L.map('map').setView([-22.3145,-49.0604],17);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19
}).addTo(map);


/* ICONE CARRO */

var carIcon = L.icon({
iconUrl:'https://i.imgur.com/7Q9QZ6R.png',
iconSize:[48,48],
iconAnchor:[24,24]
});
var marker = L.marker([-22.3145,-49.0604],{icon:carIcon}).addTo(map);


/* GPS */

if(navigator.geolocation){

navigator.geolocation.watchPosition(function(pos){

var lat = pos.coords.latitude;
var lon = pos.coords.longitude;
var speed = pos.coords.speed;

marker.setLatLng([lat,lon]);

if(speed){
var kmh = (speed*3.6).toFixed(0);
document.getElementById("speedBox").innerText = kmh+" km/h";
}

map.panTo([lat,lon]);

});

}


/* MENU CONFIG */

var menu = document.getElementById("menu");

document.getElementById("configBtn").onclick=function(){
menu.style.display="block";
}

document.getElementById("backBtn").onclick=function(){
menu.style.display="none";
}


/* SOM */

var soundActive=true;

document.getElementById("soundBtn").onclick=function(){

soundActive=!soundActive;

if(soundActive){
this.className="menuItem active";
this.innerText="Som Radar: ATIVO";
}else{
this.className="menuItem off";
this.innerText="Som Radar: DESATIVADO";
}

}


/* CENTRALIZA MAPA */

var center=false;

document.getElementById("centerBtn").onclick=function(){

center=!center;

if(center){
this.className="menuItem active";
}else{
this.className="menuItem off";
}

}


/* MODO LIVRE */

var free=true;

document.getElementById("freeBtn").onclick=function(){

free=!free;

if(free){
this.className="menuItem active";
}else{
this.className="menuItem off";
}

}

</script>

</body>
</html>
