<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>GPS Radar – Beta 3.1</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
  margin: 0;
  height: 100%;
  background: #111;
}

#map {
  width: 100%;
  height: 100%;
}

/* ===== LIMITE DE VIA ===== */
#limitBox {
  position: absolute;
  top: 12px;
  left: 12px;
  width: 78px;
  height: 78px;
  border-radius: 50%;
  border: 6px solid red;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  font-weight: bold;
  z-index: 1000;
}

/* ===== VELOCIDADE ATUAL ===== */
#speedBox {
  position: absolute;
  top: 100px;
  left: 22px;
  background: #111;
  color: white;
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 18px;
  z-index: 1000;
}

/* ===== BOTÃO CÂMERA ===== */
#freeCam {
  position: absolute;
  right: 16px;
  bottom: 20px;
  width: 56px;
  height: 56px;
  background: rgba(0,0,0,0.7);
  color: white;
  border-radius: 50%;
  font-size: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="map"></div>
<div id="limitBox">50</div>
<div id="speedBox">0 km/h</div>
<div id="freeCam">📷</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* ================= MAPA ================= */
const map = L.map('map', { zoomControl: false }).setView([0,0], 18);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom: 19
}).addTo(map);

/* ================= CONFIG ================= */
let followGPS = true;
let speedLimit = 50;
let speedBuffer = [];

/* ================= ICONE JEEP (TRASEIRA) ================= */
const jeepIcon = L.divIcon({
  className: '',
  html: `
  <svg width="42" height="60" viewBox="0 0 42 60" xmlns="http://www.w3.org/2000/svg">
    <!-- sombra -->
    <ellipse cx="21" cy="56" rx="14" ry="4" fill="rgba(0,0,0,0.4)"/>

    <!-- corpo -->
    <rect x="6" y="8" width="30" height="38" rx="8" fill="#0a0a0a"/>

    <!-- teto -->
    <rect x="10" y="2" width="22" height="10" rx="5" fill="#111"/>

    <!-- vidro traseiro -->
    <rect x="13" y="6" width="16" height="8" rx="3" fill="#1f1f1f"/>

    <!-- lanternas -->
    <circle cx="12" cy="40" r="3" fill="#ff2a2a"/>
    <circle cx="30" cy="40" r="3" fill="#ff2a2a"/>

    <!-- detalhe placa -->
    <rect x="17" y="44" width="8" height="4" rx="1" fill="#ccc"/>

    <!-- relevo lateral -->
    <rect x="8" y="18" width="2" height="20" fill="rgba(255,255,255,0.08)"/>
    <rect x="32" y="18" width="2" height="20" fill="rgba(0,0,0,0.4)"/>
  </svg>
  `,
  iconSize: [42,60],
  iconAnchor: [21,30]
});
/* ================= FREE CAM ================= */
document.getElementById("freeCam").onclick = () => {
  followGPS = !followGPS;
  document.getElementById("freeCam").style.background =
    followGPS ? "rgba(0,0,0,0.7)" : "red";
};

/* ================= GPS ================= */
let jeepMarker = null;

navigator.geolocation.watchPosition(pos => {
  const lat = pos.coords.latitude;
  const lng = pos.coords.longitude;
  const rawSpeed = pos.coords.speed ? pos.coords.speed * 3.6 : 0;

  speedBuffer.push(rawSpeed);
  if (speedBuffer.length > 6) speedBuffer.shift();
  const speed = speedBuffer.reduce((a,b)=>a+b,0)/speedBuffer.length;

  document.getElementById("speedBox").innerText = Math.round(speed) + " km/h";

  if (speed > speedLimit) {
    limitBox.style.background = "red";
    limitBox.style.color = "white";
  } else {
    limitBox.style.background = "white";
    limitBox.style.color = "black";
  }

  if (!jeepMarker) {
    jeepMarker = L.marker([lat,lng], {icon: jeepIcon}).addTo(map);
    map.setView([lat,lng], 18);
    loadSpeedLimit(lat,lng);
  } else {
    jeepMarker.setLatLng([lat,lng]);
    if (followGPS) map.panTo([lat,lng]);
  }

}, err => alert("Erro GPS: "+err.message), {
  enableHighAccuracy: true,
  timeout: 10000
});

/* ================= LIMITE VIA (OSM) ================= */
function loadSpeedLimit(lat,lng) {
  const query = `
  [out:json];
  way(around:100,${lat},${lng})["maxspeed"];
  out tags;
  `;

  fetch("https://overpass-api.de/api/interpreter", {
    method: "POST",
    body: query
  })
  .then(r => r.json())
  .then(data => {
    if (data.elements.length > 0) {
      const v = data.elements[0].tags.maxspeed;
      speedLimit = parseInt(v);
      document.getElementById("limitBox").innerText = speedLimit;
    }
  });
}
</script>

</body>
</html>
