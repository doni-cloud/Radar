<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Radar GPS – Beta 02</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html, body {
  margin: 0;
  height: 100%;
  background: #000;
}

#map {
  height: 100%;
  width: 100%;
}

/* ===== SETA ===== */
.seta {
  width: 40px;
  height: 40px;
  transform-origin: center center;
}

/* ===== VELOCIDADE ===== */
#speed {
  position: absolute;
  left: 12px;
  top: 12px;
  background: rgba(0,0,0,0.75);
  color: #fff;
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 18px;
  font-weight: bold;
  z-index: 999;
}

/* ===== PLACA VELOCIDADE ===== */
#placa {
  position: absolute;
  left: 12px;
  top: 60px;
  width: 80px;
  height: 80px;
  z-index: 999;
}

/* ===== CONFIG ===== */
#configBtn {
  position: absolute;
  right: 14px;
  top: 14px;
  font-size: 26px;
  color: #9ff;
  z-index: 999;
  cursor: pointer;
}

#configMenu {
  position: absolute;
  right: 10px;
  top: 60px;
  background: rgba(0,0,0,0.85);
  color: #fff;
  padding: 12px;
  border-radius: 10px;
  display: none;
  z-index: 999;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="speed">0 km/h</div>

<!-- PLACA EMBUTIDA -->
<div id="placa">
<svg viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="46" fill="white" stroke="red" stroke-width="8"/>
  <text id="placaValor" x="50" y="62" text-anchor="middle"
        font-size="28" font-weight="bold" fill="black">50</text>
</svg>
</div>

<div id="configBtn">⚙️</div>
<div id="configMenu">
  <div>Configurações (beta)</div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const map = L.map('map', {
  zoomControl: false,
  attributionControl: false
}).setView([-23.5505, -46.6333], 17);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

/* ===== SETA CENTRAL ===== */
const setaIcon = L.divIcon({
  className: '',
  html: `
  <svg class="seta" viewBox="0 0 100 100">
    <polygon points="50,0 90,100 50,80 10,100" fill="#19ffd9"/>
  </svg>`,
  iconSize: [40, 40],
  iconAnchor: [20, 20]
});

const marker = L.marker(map.getCenter(), { icon: setaIcon }).addTo(map);

/* ===== CONFIG MENU ===== */
document.getElementById('configBtn').onclick = () => {
  const m = document.getElementById('configMenu');
  m.style.display = m.style.display === 'block' ? 'none' : 'block';
};

/* ===== GPS ===== */
let lastPos = null;

navigator.geolocation.watchPosition(pos => {
  const lat = pos.coords.latitude;
  const lon = pos.coords.longitude;
  const speed = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
  const heading = pos.coords.heading ?? 0;

  document.getElementById('speed').innerText = speed + ' km/h';

  marker.setLatLng([lat, lon]);
  map.setView([lat, lon], map.getZoom(), { animate: false });

  const el = marker.getElement();
  if (el) {
    el.style.transform = `rotate(${heading}deg)`;
  }

}, err => {
  alert("Ative o GPS");
}, {
  enableHighAccuracy: true,
  maximumAge: 0
});
</script>

</body>
</html>
