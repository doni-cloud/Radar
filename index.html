
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>GPS Jeep – Radar Teste</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
  margin: 0;
  height: 100%;
}

#map {
  width: 100%;
  height: 100%;
}

/* LIMITE */
#limitBox {
  position: absolute;
  top: 12px;
  left: 12px;
  width: 78px;
  height: 78px;
  border-radius: 50%;
  border: 6px solid red;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  font-weight: bold;
  z-index: 1000;
}

/* VELOCIDADE */
#speedBox {
  position: absolute;
  top: 100px;
  left: 22px;
  background: #111;
  color: white;
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 18px;
  z-index: 1000;
}

/* BOTÃO CÂMERA */
#freeCam {
  position: absolute;
  right: 16px;
  bottom: 20px;
  width: 56px;
  height: 56px;
  background: red;
  color: white;
  border-radius: 50%;
  font-size: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  cursor: pointer;
}

/* BOTÃO CONFIG */
#configBtn {
  position: absolute;
  right: 16px;
  top: 16px;
  width: 48px;
  height: 48px;
  background: #111;
  color: white;
  border-radius: 50%;
  font-size: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  cursor: pointer;
}

/* MENU CONFIG */
#configMenu {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.85);
  color: white;
  display: none;
  flex-direction: column;
  z-index: 2000;
  padding: 20px;
}

.config-item {
  background: #222;
  padding: 14px;
  border-radius: 10px;
  margin-top: 10px;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="map"></div>
<div id="limitBox">50</div>
<div id="speedBox">0 km/h</div>
<div id="freeCam">📷</div>
<div id="configBtn">⚙️</div>

<div id="configMenu">
  <div class="config-item" onclick="testRadarSound()">🔊 Testar som do radar</div>
  <div class="config-item" onclick="closeConfig()">⬅️ Voltar</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* MAPA */
const map = L.map('map', { zoomControl: false }).setView([-22.33162, -49.05685], 18);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

/* CONTROLES */
let followGPS = true;
let speedLimit = 50;
let jeepMarker = null;

/* ÍCONE DO CARRO */
const jeepIcon = L.divIcon({
  className: '',
  html: `
  <div style="width:26px;height:40px;background:#111;border-radius:8px;position:relative">
    <div style="position:absolute;bottom:-6px;left:6px;width:14px;height:6px;background:#555;border-radius:3px"></div>
    <div style="position:absolute;bottom:6px;left:4px;width:6px;height:6px;background:red;border-radius:50%"></div>
    <div style="position:absolute;bottom:6px;right:4px;width:6px;height:6px;background:red;border-radius:50%"></div>
  </div>
  `,
  iconSize: [26,40],
  iconAnchor: [13,20]
});

/* RADAR TESTE (LOCAL EXATO) */
const radarIcon = L.divIcon({
  className: '',
  html: `
    <div style="
      width:28px;
      height:28px;
      background:#1f1f1f;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 0 6px rgba(0,0,0,0.6);
    ">📷</div>
  `,
  iconSize: [28,28],
  iconAnchor: [14,14]
});

L.marker([-22.33162, -49.05685], {
  icon: radarIcon,
  interactive: false
}).addTo(map);

/* GPS */
navigator.geolocation.watchPosition(pos => {
  const lat = pos.coords.latitude;
  const lng = pos.coords.longitude;
  const speed = pos.coords.speed ? pos.coords.speed * 3.6 : 0;

  speedBox.innerText = Math.round(speed) + " km/h";

  if (jeepMarker) map.removeLayer(jeepMarker);
  jeepMarker = L.marker([lat,lng], { icon: jeepIcon }).addTo(map);

  if (followGPS) {
    map.setView([lat,lng], map.getZoom(), { animate: false });
  }
});

/* BOTÕES */
freeCam.onclick = () => {
  followGPS = !followGPS;
  freeCam.style.background = followGPS ? "red" : "green";
};

configBtn.onclick = () => configMenu.style.display = "flex";
function closeConfig() { configMenu.style.display = "none"; }

/* 🔊 SOM DE RADAR (NOVO – EMBUTIDO) */
function testRadarSound() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const o = ctx.createOscillator();
  const g = ctx.createGain();

  o.type = "square";
  o.frequency.value = 1200;
  g.gain.value = 0.4;

  o.connect(g);
  g.connect(ctx.destination);

  o.start();
  setTimeout(() => o.stop(), 180);
}
</script>

</body>
</html>
