<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>GPS Navegação</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Leaflet -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
  }

  #map {
    width: 100%;
    height: 100%;
  }

  .seta-container svg {
    width: 50px;
    height: 50px;
    transform-origin: 50% 50%;
    transition: transform 0.2s linear;
  }
</style>
</head>

<body>
<div id="map"></div>

<script>
/* ===============================
   MAPA
================================ */
const map = L.map('map', {
  zoomControl: true,
  attributionControl: false
}).setView([0, 0], 18);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

/* ===============================
   ÍCONE DA SETA (CENTRO PERFEITO)
================================ */
const setaIcon = L.divIcon({
  className: 'seta-container',
  html: `
    <svg id="setaSvg" viewBox="0 0 100 100">
      <polygon points="50,5 95,95 50,75 5,95" fill="#FFD400"/>
    </svg>
  `,
  iconSize: [50, 50],
  iconAnchor: [25, 25]
});

/* ===============================
   MARCADOR
================================ */
const marcador = L.marker([0, 0], {
  icon: setaIcon
}).addTo(map);

/* ===============================
   GPS EM TEMPO REAL
================================ */
if ("geolocation" in navigator) {
  navigator.geolocation.watchPosition(
    (pos) => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const heading = pos.coords.heading ?? 0;

      // Atualiza posição da seta
      marcador.setLatLng([lat, lon]);

      // Centraliza suavemente
      map.panTo([lat, lon], {
        animate: true,
        duration: 0.5
      });

      // Rotaciona apenas o SVG (SEM BUG)
      const seta = document.getElementById("setaSvg");
      if (seta) {
        seta.style.transform = `rotate(${heading}deg)`;
      }
    },
    (err) => {
      alert("Erro ao acessar GPS");
      console.error(err);
    },
    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 10000
    }
  );
} else {
  alert("GPS não suportado neste navegador");
}
</script>
</body>
</html>
