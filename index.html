<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GPS Radar</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html,body{
margin:0;
padding:0;
height:100%;
font-family:Arial;
}

#map{
height:100%;
width:100%;
}

#speedBox{
position:absolute;
top:12px;
left:12px;
background:black;
color:white;
padding:10px 18px;
border-radius:14px;
font-size:22px;
z-index:1000;
}

#limitBox{
position:absolute;
top:12px;
left:130px;
width:56px;
height:56px;
border-radius:50%;
border:5px solid red;
background:white;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
z-index:1000;
}

#radarAlert{
position:absolute;
top:12px;
right:12px;
width:200px;
background:#1b1b1b;
border:4px solid #2ecc71;
border-radius:14px;
color:white;
text-align:center;
padding:10px;
z-index:1000;
}

#configBtn{
position:absolute;
bottom:20px;
right:20px;
width:60px;
height:60px;
border-radius:50%;
background:black;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
color:white;
cursor:pointer;
z-index:1000;
}

#menu{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:#111;
color:white;
display:none;
z-index:2000;
padding:30px;
}

.menuItem{
padding:14px;
margin:12px 0;
border-radius:10px;
font-size:20px;
cursor:pointer;
}

.active{background:green;}
.off{background:red;}

#backBtn{
margin-top:30px;
background:#444;
padding:14px;
border-radius:10px;
text-align:center;
cursor:pointer;
}

</style>
</head>

<body>

<div id="map"></div>

<div id="speedBox">0 km/h</div>
<div id="limitBox">60</div>

<div id="radarAlert">
<h3>SEM RADAR</h3>
<hr>
<h3>RADAR À FRENTE</h3>
<h2>LIVRE</h2>
</div>

<div id="configBtn">⚙</div>

<div id="menu">

<h2>Configurações</h2>

<div id="soundBtn" class="menuItem active">
Som Radar: ATIVO
</div>

<div id="backBtn">Voltar</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* MAPA */

var map = L.map('map').setView([-22.3145,-49.0604],17);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19
}).addTo(map);


/* ICON CARRO */

const jeepIcon = L.divIcon({
className:'',
html:`<div style="
width:28px;
height:28px;
background:black;
border:4px solid white;
border-radius:50%;
"></div>`,
iconSize:[28,28],
iconAnchor:[14,14]
});


/* MARKER */

var marker = L.marker([-22.3145,-49.0604],{
icon:jeepIcon
}).addTo(map);


/* GPS */

if(navigator.geolocation){

navigator.geolocation.watchPosition(function(pos){

var lat = pos.coords.latitude;
var lon = pos.coords.longitude;
var speed = pos.coords.speed || 0;

/* POSIÇÃO CARRO */

marker.setLatLng([lat,lon]);

/* VELOCIDADE */

var kmh = Math.round(speed*3.6);
document.getElementById("speedBox").innerText = kmh+" km/h";

/* MAPA SEMPRE SEGUIR */

map.setView([lat,lon],17);

},{
enableHighAccuracy:true,
maximumAge:0,
timeout:4000
});

}


/* ESPERAR DOM */

window.onload=function(){

var menu=document.getElementById("menu");

document.getElementById("configBtn").onclick=function(){
menu.style.display="block";
}

document.getElementById("backBtn").onclick=function(){
menu.style.display="none";
}

}

</script>

</body>
</html>
