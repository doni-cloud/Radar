<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Radar SP – Beta 2.1</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #000;
}

#map {
  height: 100%;
  width: 100%;
}

/* PLACA DE VELOCIDADE */
#speedSign {
  position: absolute;
  left: 15px;
  top: 80px;
  width: 110px;
  height: 110px;
  background: white;
  border: 10px solid red;
  border-radius: 50%;
  text-align: center;
  z-index: 999;
  box-sizing: border-box;
}

#speedNumber {
  font-size: 36px;
  font-weight: bold;
  margin-top: 18px;
}

#speedUnit {
  font-size: 14px;
  margin-top: -4px;
}

/* CONFIG */
#configBtn {
  position: absolute;
  top: 15px;
  right: 15px;
  font-size: 26px;
  color: #fff;
  z-index: 999;
  cursor: pointer;
}

#configPanel {
  position: absolute;
  top: 0;
  right: 0;
  width: 260px;
  height: 100%;
  background: #111;
  color: #fff;
  padding: 20px;
  display: none;
  z-index: 1000;
}

/* SETA */
.arrow {
  width: 0;
  height: 0;
  border-left: 16px solid transparent;
  border-right: 16px solid transparent;
  border-bottom: 32px solid #00ffd5;
}
</style>
</head>

<body>

<div id="map"></div>

<!-- PLACA -->
<div id="speedSign">
  <div id="speedNumber">0</div>
  <div id="speedUnit">km/h</div>
</div>

<!-- CONFIG -->
<div id="configBtn">⚙️</div>
<div id="configPanel">
  <h3>Configurações</h3>
  <p>(em desenvolvimento)</p>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const map = L.map('map', {
  zoomControl: false
}).setView([-23.5505, -46.6333], 17);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

// ÍCONE DA SETA (CENTRALIZADO)
const arrowIcon = L.divIcon({
  className: '',
  html: '<div class="arrow" id="arrow"></div>',
  iconSize: [32, 32],
  iconAnchor: [16, 16]
});

let marker = L.marker([-23.5505, -46.6333], {
  icon: arrowIcon
}).addTo(map);

let isCentered = false;
let lastSpeed = 0;

if ("geolocation" in navigator) {
  navigator.geolocation.watchPosition(
    pos => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const heading = pos.coords.heading || 0;
      const speed = pos.coords.speed ? pos.coords.speed * 3.6 : lastSpeed;

      lastSpeed = speed;

      marker.setLatLng([lat, lon]);

      // Centraliza só uma vez (BUG RESOLVIDO)
      if (!isCentered) {
        map.setView([lat, lon], 17);
        isCentered = true;
      }

      // Rotação correta da seta
      const arrowEl = document.getElementById("arrow");
      if (arrowEl) {
        arrowEl.style.transform = `rotate(${heading}deg)`;
      }

      document.getElementById("speedNumber").innerText =
        Math.round(speed);
    },
    err => {
      alert("Ative a localização (GPS)");
    },
    {
      enableHighAccuracy: true,
      maximumAge: 500,
      timeout: 10000
    }
  );
}

// CONFIG
const btn = document.getElementById("configBtn");
const panel = document.getElementById("configPanel");

btn.onclick = () => {
  panel.style.display = panel.style.display === "block" ? "none" : "block";
};
</script>

</body>
</html>
