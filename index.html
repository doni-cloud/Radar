
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>GPS Jeep Renegade – Beta 4</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
  margin: 0;
  height: 100%;
  background: #111;
}

#map {
  width: 100%;
  height: 100%;
}

/* LIMITE DA VIA */
#limitBox {
  position: absolute;
  top: 12px;
  left: 12px;
  width: 78px;
  height: 78px;
  border-radius: 50%;
  border: 6px solid red;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  font-weight: bold;
  z-index: 1000;
}

/* VELOCIDADE ATUAL */
#speedBox {
  position: absolute;
  top: 100px;
  left: 22px;
  background: #111;
  color: white;
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 18px;
  z-index: 1000;
}

/* BOTÃO CÂMERA */
#freeCam {
  position: absolute;
  right: 16px;
  bottom: 20px;
  width: 56px;
  height: 56px;
  background: red;
  color: white;
  border-radius: 50%;
  font-size: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  cursor: pointer;
}

/* BOTÃO CONFIG */
#configBtn {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 46px;
  height: 46px;
  background: #111;
  color: white;
  border-radius: 50%;
  font-size: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1001;
  cursor: pointer;
}

/* MENU CONFIG */
#configMenu {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.88);
  color: white;
  display: none;
  z-index: 2000;
  padding: 20px;
}

.menuBox {
  margin-top: 40px;
  background: #1a1a1a;
  padding: 20px;
  border-radius: 12px;
}

.menuItem {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 14px;
}

/* ÍCONE RADAR */
.radarIcon {
  width: 32px;
  height: 32px;
  background: url("data:image/svg+xml;base64,PHN2ZyBmaWxsPSIjRkYwMDAwIiB2aWV3Qm94PSIwIDAgMjQgMjQiPjxjaXJjbGUgY3g9IjEyIiBjeT0iMTIiIHI9IjkiLz48cGF0aCBkPSJNMTIgM2E5IDkgMCAwIDEgMCAxOCIvPjwvc3ZnPg==") no-repeat center;
  background-size: contain;
}

/* FUMAÇA */
@keyframes smoke {
  from { opacity: 0.6; transform: translate(0,0) scale(1); }
  to   { opacity: 0; transform: translate(-12px,12px) scale(1.7); }
}
.smoke {
  position: absolute;
  width: 10px;
  height: 10px;
  background: rgba(200,200,200,0.6);
  border-radius: 50%;
  animation: smoke 1s linear infinite;
}
</style>
</head>

<body>

<div id="map"></div>
<div id="limitBox">50</div>
<div id="speedBox">0 km/h</div>
<div id="freeCam">📷</div>
<div id="configBtn">⚙️</div>

<div id="configMenu">
  <button onclick="closeConfig()">⬅ Voltar</button>
  <div class="menuBox">
    <h3>Som</h3>
    <div class="menuItem">
      <span>Alerta Radar</span>
      <button onclick="toggleSound()">Testar Bip</button>
      <span id="soundStatus">Ativo</span>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* MAPA */
const map = L.map('map', { zoomControl:false }).setView([-22.3145,-49.0587], 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{ maxZoom:19 }).addTo(map);

/* CONFIG */
let followGPS = true;
let soundEnabled = true;
let speedLimit = 50;
let jeepMarker = null;
let speedBuffer = [];
let triggeredRadars = new Set();

/* JEEP */
const jeepIcon = L.divIcon({
  className:'',
  html:`
  <div style="width:48px;height:70px;position:relative">
    <svg width="48" height="70">
      <ellipse cx="24" cy="66" rx="16" ry="4" fill="rgba(0,0,0,.45)"/>
      <rect x="8" y="10" width="32" height="42" rx="9" fill="#0b0b0b"/>
      <rect x="12" y="4" width="24" height="12" rx="6" fill="#111"/>
    </svg>
    <div class="smoke" style="left:10px;bottom:4px"></div>
    <div class="smoke" style="right:10px;bottom:4px"></div>
  </div>`,
  iconSize:[48,70],
  iconAnchor:[24,35]
});

/* RADARES (Bauru + Rodovias) */
const radars = [
  [-22.3142,-49.0581], // Nações Unidas
  [-22.3131,-49.0675], // Castelo Branco
  [-22.3298,-49.0952], // Getúlio Vargas
  [-22.3434,-49.1019], // SP-300
  [-22.3391,-49.0568], // SP-321
  [-22.2851,-49.1602], // SP-294
  [-22.2304,-49.2156]  // SP-273
];

const radarIcon = L.divIcon({
  className:'',
  html:`<div class="radarIcon"></div>`,
  iconSize:[32,32],
  iconAnchor:[16,16]
});

radars.forEach((r,i)=>{
  L.marker(r,{icon:radarIcon}).addTo(map).radarId=i;
});

/* SOM BIP */
const audio = new Audio("data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=");

/* BOTÕES */
freeCam.onclick=()=>{
  followGPS=!followGPS;
  freeCam.style.background = followGPS ? "red":"green";
};

configBtn.onclick=()=> configMenu.style.display="block";
function closeConfig(){ configMenu.style.display="none"; }
function toggleSound(){
  audio.play();
  soundEnabled=!soundEnabled;
  soundStatus.innerText = soundEnabled ? "Ativo":"Desativado";
}

/* GPS */
navigator.geolocation.watchPosition(pos=>{
  const lat=pos.coords.latitude;
  const lng=pos.coords.longitude;
  const sp=pos.coords.speed?pos.coords.speed*3.6:0;

  speedBuffer.push(sp);
  if(speedBuffer.length>6) speedBuffer.shift();
  const speed=speedBuffer.reduce((a,b)=>a+b,0)/speedBuffer.length;
  speedBox.innerText=Math.round(speed)+" km/h";

  if(jeepMarker) map.removeLayer(jeepMarker);
  jeepMarker=L.marker([lat,lng],{icon:jeepIcon}).addTo(map);

  if(followGPS){
    map.panTo([lat,lng],{animate:false});
  }

  radars.forEach((r,i)=>{
    const d = map.distance([lat,lng],r);
    if(d<50 && !triggeredRadars.has(i)){
      triggeredRadars.add(i);
      if(soundEnabled) audio.play();
    }
  });

},{ enableHighAccuracy:true });
</script>

</body>
</html>
