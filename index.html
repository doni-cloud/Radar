<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar Teste Estável</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #eef1f4;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

/* Container */
#app {
  position: relative;
  width: 100%;
  height: 100%;
}

/* Veículo */
#veiculo {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 80px;
  height: 80px;
  transform: translate(-50%, -50%) rotate(0deg);
  transition: transform 0.15s linear;
}

/* Placa */
#placa {
  position: absolute;
  top: 16px;
  left: 16px;
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: #fff;
  border: 8px solid red;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  font-weight: bold;
}

/* Velocidade */
#velocidade {
  position: absolute;
  top: 120px;
  left: 16px;
  background: #222;
  color: #fff;
  padding: 6px 14px;
  border-radius: 10px;
  font-size: 16px;
}
</style>
</head>

<body>

<div id="app">

<!-- Jeep + seta (frente sempre para cima) -->
<svg id="veiculo" viewBox="0 0 100 100">
  <!-- Seta -->
  <polygon points="50,5 65,35 55,35 55,85 45,85 45,35 35,35"
           fill="#1ea7ff"/>
  <!-- Jeep -->
  <rect x="28" y="55" width="44" height="22" rx="5" fill="#111"/>
  <circle cx="35" cy="82" r="5" fill="#000"/>
  <circle cx="65" cy="82" r="5" fill="#000"/>
</svg>

<div id="placa">80</div>
<div id="velocidade">0 km/h</div>

</div>

<script>
// ===== ESTADO =====
let heading = 0;          // direção (graus)
let velocidade = 0;       // km/h
let alvoVel = 60;         // velocidade alvo
let limiteVia = 80;

// ===== ELEMENTOS =====
const veiculo = document.getElementById("veiculo");
const velocidadeEl = document.getElementById("velocidade");
const placaEl = document.getElementById("placa");

// ===== SIMULA DIREÇÃO SUAVE =====
setInterval(() => {
  heading += 5;
  if (heading > 360) heading = 0;

  veiculo.style.transform =
    `translate(-50%, -50%) rotate(${heading}deg)`;
}, 300);

// ===== SIMULA VELOCIDADE REALISTA =====
setInterval(() => {
  if (velocidade < alvoVel) {
    velocidade += 2;
  } else if (velocidade > alvoVel) {
    velocidade -= 1;
  }

  velocidadeEl.innerText = velocidade + " km/h";

  // alerta visual
  placaEl.style.background =
    velocidade > limiteVia ? "#ffe1e1" : "#fff";
}, 500);

// ===== MUDA VIA / RADAR =====
const vias = [50, 60, 80, 100, 110];
let idx = 2;

setInterval(() => {
  idx = (idx + 1) % vias.length;
  limiteVia = vias[idx];
  alvoVel = limiteVia - 10;
  placaEl.innerText = limiteVia;
}, 5000);
</script>

</body>
</html>
