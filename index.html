
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Radar Beta 3</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html, body, #map {
    height: 100%;
    margin: 0;
}

/* BOTÃO CONFIG */
#btnConfig {
    position: absolute;
    top: 15px;
    right: 15px;
    z-index: 1000;
    background: #111;
    color: #fff;
    border-radius: 50%;
    width: 45px;
    height: 45px;
    font-size: 22px;
    border: none;
}

/* FUNDO ESCURO */
#overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 2000;
    display: none;
}

/* MENU */
#menu {
    position: absolute;
    top: 0;
    right: 0;
    width: 80%;
    height: 100%;
    background: #1c1c1c;
    color: #fff;
    padding: 20px;
}

/* BOTÃO VOLTAR */
#btnVoltar {
    background: none;
    border: none;
    color: #fff;
    font-size: 18px;
    margin-bottom: 20px;
}

/* ITEM MENU */
.menuItem {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    font-size: 18px;
}

/* BOTÃO TOGGLE */
.toggle {
    width: 90px;
    padding: 8px;
    border-radius: 20px;
    text-align: center;
    font-weight: bold;
    cursor: pointer;
}
.on { background: green; }
.off { background: red; }
</style>
</head>

<body>

<div id="map"></div>

<button id="btnConfig">⚙️</button>

<div id="overlay">
    <div id="menu">
        <button id="btnVoltar">← Voltar</button>

        <div class="menuItem">
            <span>Som do Radar</span>
            <div id="toggleSom" class="toggle off">DESLIGADO</div>
        </div>

        <div class="menuItem">
            <span>Testar Bip</span>
            <button onclick="tocarBip()">▶️</button>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
// ================= MAPA (BETA 3 — NÃO MEXIDO)
const map = L.map('map').setView([-22.3145, -49.0586], 16);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
}).addTo(map);

// ================= MENU CONFIG
const overlay = document.getElementById('overlay');
document.getElementById('btnConfig').onclick = () => overlay.style.display = 'block';
document.getElementById('btnVoltar').onclick = () => overlay.style.display = 'none';

// ================= SOM EXTRAÍDO DO SEU VÍDEO
const audio = new Audio("data:audio/wav;base64,{{AQUI_VAI_O_BASE64}}");

let somAtivo = false;
const toggle = document.getElementById('toggleSom');

toggle.onclick = () => {
    somAtivo = !somAtivo;
    toggle.className = "toggle " + (somAtivo ? "on" : "off");
    toggle.innerText = somAtivo ? "ATIVADO" : "DESLIGADO";
};

function tocarBip() {
    if (!somAtivo) return;
    audio.currentTime = 0;
    audio.play();
}
</script>

</body>
</html>
