
<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body{
margin:0;
font-family:Arial;
background:black;
}

#map{
height:100vh;
width:100%;
}

/* velocimetro */

#speedBox{
position:absolute;
top:15px;
left:50%;
transform:translateX(-50%);
background:#111;
color:white;
padding:10px 20px;
border-radius:10px;
font-size:26px;
z-index:1000;
}

/* limite via */

#limitBox{
position:absolute;
top:70px;
left:50%;
transform:translateX(-50%);
background:white;
border:4px solid red;
color:black;
padding:10px;
border-radius:50%;
font-weight:bold;
font-size:20px;
z-index:1000;
}

/* radar aviso */

#radarAlert{

position:absolute;
top:130px;
left:50%;
transform:translateX(-50%);

background:#111;
color:white;

padding:14px 20px;

border-radius:12px;

border-left:6px solid red;

text-align:center;

z-index:1000;

}

#radarDistance{

  /* botão config */

#configBtn{

position:absolute;
bottom:20px;
right:20px;

background:#111;
color:white;

padding:12px 16px;

border-radius:10px;

font-size:18px;

z-index:1000;

}

/* menu config */

#configMenu{

position:absolute;
top:0;
left:0;

width:100%;
height:100%;

background:black;
color:white;

display:none;

z-index:2000;

padding:30px;

}

/* botão voltar */

#backBtn{

position:absolute;
top:20px;
left:20px;

background:#222;
color:white;

padding:10px 16px;

border-radius:8px;

font-size:16px;

}
margin-top:6px;
font-size:22px;
font-weight:bold;
color:#ff4444;

}

</style>

</head>

<body>

<div id="map"></div>

<div id="speedBox">0 km/h</div>

<div id="limitBox">60</div>

<div id="radarAlert">

<div>📡 RADAR</div>

<div>⚠ RADAR A FRENTE</div>

<div id="radarDistance">Esperando detecção</div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let map = L.map('map').setView([-22.3145,-49.0602],17);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19
}).addTo(map);

/* jeep icon */

let jeepIcon = L.divIcon({

html:"🚙",

iconSize:[30,30]

});

let jeepMarker = null;

/* radar exemplo */

let radarLat = -22.3150;
let radarLng = -49.0610;

/* distância */

function getDistance(lat1,lon1,lat2,lon2){

const R=6371000;

const dLat=(lat2-lat1)*Math.PI/180;
const dLon=(lon2-lon1)*Math.PI/180;

const a=
Math.sin(dLat/2)*Math.sin(dLat/2)+
Math.cos(lat1*Math.PI/180)*
Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)*Math.sin(dLon/2);

const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));

return R*c;

}

/* movimento suave */

function smoothMove(lat,lng){

if(!jeepMarker){

jeepMarker=L.marker([lat,lng],{icon:jeepIcon}).addTo(map);
return;

}

let start=jeepMarker.getLatLng();

let steps=10;
let i=0;

let move=setInterval(()=>{

i++;

let newLat=start.lat+(lat-start.lat)*(i/steps);
let newLng=start.lng+(lng-start.lng)*(i/steps);

jeepMarker.setLatLng([newLat,newLng]);

if(i>=steps) clearInterval(move);

},50);

}

/* gps */

navigator.geolocation.watchPosition(pos=>{

let lat=pos.coords.latitude;
let lng=pos.coords.longitude;

let speed=pos.coords.speed;

if(speed==null) speed=0;

speed=Math.round(speed*3.6);

document.getElementById("speedBox").innerText=speed+" km/h";

smoothMove(lat,lng);

map.setView([lat,lng]);

let dist=getDistance(lat,lng,radarLat,radarLng);

let radarText=document.getElementById("radarDistance");

if(dist<=500){

radarText.innerText=Math.round(dist)+" m";

}else{

radarText.innerText="Esperando detecção";

}

});

</script>

</body>
</html>
