<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GPS Radar</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html,body{
margin:0;
padding:0;
height:100%;
font-family:Arial;
}

#map{
height:100%;
width:100%;
}

/* VELOCÍMETRO */

#speedBox{
position:absolute;
top:12px;
left:12px;
background:black;
color:white;
padding:10px 18px;
border-radius:14px;
font-size:22px;
z-index:1000;
}

/* LIMITE VIA */

#limitBox{
position:absolute;
top:12px;
left:130px;
width:56px;
height:56px;
border-radius:50%;
border:5px solid red;
background:white;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
z-index:1000;
}

/* ALERTA RADAR */

#radarAlert{
position:absolute;
top:12px;
right:12px;
width:200px;
background:#1b1b1b;
border:4px solid #2ecc71;
border-radius:14px;
color:white;
text-align:center;
padding:10px;
z-index:1000;
}

#radarAlert h3{
margin:4px;
font-size:14px;
}

#radarAlert h2{
margin:6px;
font-size:28px;
}

/* CONFIGURAÇÃO */

#configBtn{
position:absolute;
bottom:20px;
right:20px;
width:60px;
height:60px;
border-radius:50%;
background:black;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
color:white;
cursor:pointer;
z-index:1000;
box-shadow:0 3px 8px rgba(0,0,0,0.5);
}

/* MENU */

#menu{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:#111;
color:white;
display:none;
z-index:2000;
padding:30px;
}

.menuItem{
padding:14px;
margin:12px 0;
border-radius:10px;
font-size:20px;
cursor:pointer;
}

.active{
background:green;
}

.off{
background:red;
}

#backBtn{
margin-top:30px;
background:#444;
padding:14px;
border-radius:10px;
text-align:center;
cursor:pointer;
}

</style>
</head>

<body>

<div id="map"></div>

<div id="speedBox">0 km/h</div>

<div id="limitBox">60</div>

<div id="radarAlert">
<h3 id="radarTitle">SEM RADAR</h3>
<hr>
<h3 id="radarText">RADAR À FRENTE</h3>
<h2 id="radarDist">LIVRE</h2>
</div>

<div id="configBtn">⚙</div>

<div id="menu">

<h2>Configurações</h2>

<div id="soundBtn" class="menuItem active">
Som Radar: ATIVO
</div>

<div id="centerBtn" class="menuItem off">
Centralizar mapa
</div>

<div id="freeBtn" class="menuItem active">
Modo livre
</div>

<div id="backBtn">
Voltar
</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* MAPA */

var map = L.map('map').setView([-22.3145,-49.0604],17);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19
}).addTo(map);


/* JEEP BETA 3 */

const jeepIcon = L.divIcon({
className:'',
html:`
<div style="position:relative;width:48px;height:70px;">
<svg width="48" height="70" viewBox="0 0 48 70">

<ellipse cx="24" cy="66" rx="16" ry="4" fill="rgba(0,0,0,0.45)"/>

<rect x="8" y="10" width="32" height="42" rx="9" fill="#0b0b0b"/>
<rect x="12" y="4" width="24" height="12" rx="6" fill="#111"/>

<rect x="15" y="8" width="18" height="8" rx="3" fill="#1c1c1c"/>

<circle cx="14" cy="46" r="3.2" fill="#ff2a2a"/>
<circle cx="34" cy="46" r="3.2" fill="#ff2a2a"/>

<rect x="18" y="50" width="12" height="5" rx="1.5" fill="#ccc"/>

</svg>
</div>
`,
iconSize:[48,70],
iconAnchor:[24,35]
});

/* MARKER (isso estava faltando no seu código) */

var marker = L.marker([-22.3145,-49.0604],{
icon:jeepIcon
}).addTo(map);


/* GPS */

if(navigator.geolocation){

navigator.geolocation.watchPosition(function(pos){

var lat = pos.coords.latitude;
var lon = pos.coords.longitude;
var speed = pos.coords.speed;

marker.setLatLng([lat,lon]);

if(speed){
var kmh = (speed*3.6).toFixed(0);
document.getElementById("speedBox").innerText = kmh+" km/h";
}

if(center){
map.panTo([lat,lon]);
}

});

}


/* RADAR STATUS */

function radarLivre(){

document.getElementById("radarAlert").style.borderColor="#2ecc71";
document.getElementById("radarTitle").innerText="SEM RADAR";
document.getElementById("radarDist").innerText="LIVRE";

}

function radar500(){

document.getElementById("radarAlert").style.borderColor="#ff8c00";
document.getElementById("radarTitle").innerText="RADAR DETECTADO";
document.getElementById("radarDist").innerText="500 m";

}


/* MENU CONFIG */

var menu=document.getElementById("menu");

document.getElementById("configBtn").onclick=function(){
menu.style.display="block";
}

document.getElementById("backBtn").onclick=function(){
menu.style.display="none";
}


/* SOM */

var soundActive=true;

document.getElementById("soundBtn").onclick=function(){

soundActive=!soundActive;

if(soundActive){
this.className="menuItem active";
this.innerText="Som Radar: ATIVO";
}else{
this.className="menuItem off";
this.innerText="Som Radar: DESATIVADO";
}

}


/* CENTRALIZA MAPA */

var center=false;

document.getElementById("centerBtn").onclick=function(){

center=!center;

if(center){
this.className="menuItem active";
}else{
this.className="menuItem off";
}

}


/* MODO LIVRE */

var free=true;

document.getElementById("freeBtn").onclick=function(){

free=!free;

if(free){
this.className="menuItem active";
}else{
this.className="menuItem off";
}

}

</script>

</body>
</html>
