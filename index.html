<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Radar GPS – Beta 3</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html, body, #map {
  height: 100%;
  margin: 0;
}

#speedBox {
  position: absolute;
  top: 10px;
  left: 10px;
  background: #222;
  color: #fff;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 16px;
  z-index: 1000;
}

#limitBox {
  position: absolute;
  top: 70px;
  left: 10px;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  border: 6px solid red;
  background: white;
  font-size: 26px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
.over {
  background: red !important;
  color: white;
}
</style>
</head>

<body>
<div id="map"></div>
<div id="speedBox">0 km/h</div>
<div id="limitBox">50</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
// ================== MAPA ==================
const map = L.map('map').setView([-23.55, -46.63], 16);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom: 19
}).addTo(map);

// ================== ICONES BASE64 ==================

// Jeep (exemplo simplificado – pode trocar pela sua base64 real)
const jeepIcon = L.icon({
  iconUrl: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAMAAAAoLQ9TAAAAZlBMVEUAAAD///////////////////////////////////////////////////////////////////////////////////////////////////////////////8a3n+BAAAAJXRSTlMAAQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA8Ck8AAABASURBVBgZBcEJDoAgDATQnX//Zy1pAkEoPoeAQMZp2s5S6sBQLi3GSh7MG4wFZ8c5CMBx5xW9AAAAAElFTkSuQmCC',
  iconSize: [48,48],
  iconAnchor: [24,24]
});

// Radar
const radarIcon = L.icon({
  iconUrl: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAMAAAAoLQ9TAAAAY1BMVEUAAAD///////////////////////////////////////////////////////////////////////////////////////////////////////////////9p4ZHrAAAAI3RSTlMAAQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA5ZZrGAAAAQklEQVQYV2NgQAX/GEMGJhYmBgYGJgYGBgYGJiZmBgYGFgYGRkZGRgYGJiZmBgYGJgYGBgYGJgYGBgYGBgAAAMF8R1J3uTtAAAAAElFTkSuQmCC',
  iconSize: [32,32],
  iconAnchor: [16,16]
});

// Semáforo
const signalIcon = L.icon({
  iconUrl: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAMAAAAoLQ9TAAAAZlBMVEUAAAD///////////////////////////////////////////////////////////////////////////////////////////////////////////////8a3n+BAAAAJXRSTlMAAQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA8Ck8AAABASURBVBgZBcEJDoAgDATQnX//Zy1pAkEoPoeAQMZp2s5S6sBQLi3GSh7MG4wFZ8c5CMBx5xW9AAAAAElFTkSuQmCC',
  iconSize: [32,32],
  iconAnchor: [16,16]
});

// ================== MARKER ==================
const userMarker = L.marker([-23.55, -46.63], {icon: jeepIcon}).addTo(map);

// ================== AUDIO ==================
const beepRadar = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=');
const beepSignal = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=');

let lastAlert = 0;

// ================== GPS ==================
navigator.geolocation.watchPosition(pos => {
  const lat = pos.coords.latitude;
  const lon = pos.coords.longitude;
  const speed = pos.coords.speed ? pos.coords.speed * 3.6 : 0;

  userMarker.setLatLng([lat, lon]);
  map.setView([lat, lon], map.getZoom());

  document.getElementById('speedBox').innerText = Math.round(speed) + ' km/h';

  const limit = 50;
  document.getElementById('limitBox').innerText = limit;

  if (speed > limit) {
    document.getElementById('limitBox').classList.add('over');
  } else {
    document.getElementById('limitBox').classList.remove('over');
  }

  fetchRadars(lat, lon);

}, err => {
  alert("Ative o GPS");
}, { enableHighAccuracy: true });

// ================== RADAR / SEMAFORO ==================
let loaded = false;

function fetchRadars(lat, lon){
  if (loaded) return;
  loaded = true;

  const query = `
  [out:json];
  (
    node(around:800,${lat},${lon})["highway"="speed_camera"];
    node(around:800,${lat},${lon})["highway"="traffic_signals"];
  );
  out;
  `;

  fetch("https://overpass-api.de/api/interpreter",{
    method:"POST",
    body:query
  })
  .then(r=>r.json())
  .then(data=>{
    data.elements.forEach(el=>{
      const icon = el.tags.highway === "speed_camera" ? radarIcon : signalIcon;
      const marker = L.marker([el.lat, el.lon], {icon}).addTo(map);

      const dist = map.distance([el.lat, el.lon], userMarker.getLatLng());
      if (dist < 300 && Date.now() - lastAlert > 8000) {
        lastAlert = Date.now();
        el.tags.highway === "speed_camera" ? beepRadar.play() : beepSignal.play();
      }
    });
  });
}
</script>
</body>
</html>
