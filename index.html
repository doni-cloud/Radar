<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Beta 3 – Navegação</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
  margin: 0;
  height: 100%;
}

#map {
  width: 100%;
  height: 100%;
}

/* Placa de velocidade */
#speedBox {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 1000;
  text-align: center;
}

#limit {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  border: 6px solid red;
  background: white;
  font-size: 28px;
  font-weight: bold;
  line-height: 58px;
}

#speed {
  margin-top: 5px;
  background: #222;
  color: white;
  padding: 4px 10px;
  border-radius: 10px;
}

/* Ícone do carro (seta simples por enquanto – base Beta 3) */
.car {
  width: 24px;
  height: 40px;
  background: linear-gradient(#111,#333);
  border-radius: 6px;
}
</style>
</head>

<body>

<div id="speedBox">
  <div id="limit">50</div>
  <div id="speed">0 km/h</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* ================= MAPA ================= */
const map = L.map('map', {
  zoomControl: false,
  attributionControl: false
}).setView([0,0], 18);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

/* ================= ÍCONE CARRO ================= */
const carIcon = L.divIcon({
  className: '',
  html: '<div class="car"></div>',
  iconSize: [24, 40],
  iconAnchor: [12, 20]
});

let carMarker = L.marker([0,0], { icon: carIcon }).addTo(map);

/* ================= RADAR FIXO (EXEMPLO) ================= */
const radarPoint = L.latLng(-22.3145, -49.0585); // exemplo
L.circleMarker(radarPoint, {
  radius: 8,
  color: 'red',
  fillColor: 'red',
  fillOpacity: 1
}).addTo(map);

/* ================= SOM DO RADAR ================= */
const radarSound = new Audio("data:audio/mp3;base64,{{B64}}".replace("{{B64}}", `
{{AUDIO_BASE64}}
`));

let radarTriggered = false;

/* ================= GPS ================= */
let lastPos = null;

navigator.geolocation.watchPosition(pos => {
  const lat = pos.coords.latitude;
  const lon = pos.coords.longitude;
  const speed = pos.coords.speed ? pos.coords.speed * 3.6 : 0;
  const heading = pos.coords.heading || 0;

  const current = L.latLng(lat, lon);

  // Atualiza velocidade
  document.getElementById("speed").innerText = speed.toFixed(0) + " km/h";

  // Movimento suave
  if (lastPos) {
    carMarker.setLatLng(current);
  } else {
    carMarker.setLatLng(current);
    map.setView(current, 18);
  }

  // Rotação do carro
  const carEl = carMarker.getElement()?.querySelector(".car");
  if (carEl) {
    carEl.style.transform = `rotate(${heading}deg)`;
  }

  // Rotação do mapa
  map.getPane('mapPane').style.transform = `rotate(${-heading}deg)`;
  map.getPane('mapPane').style.transformOrigin = "50% 50%";

  map.panTo(current, { animate: false });

  /* ===== RADAR – 50 METROS ===== */
  const dist = current.distanceTo(radarPoint);
  if (dist < 50 && !radarTriggered) {
    radarSound.play();
    radarTriggered = true;
  }

  if (dist > 80) radarTriggered = false;

  lastPos = current;

}, err => {
  alert("Erro GPS");
}, {
  enableHighAccuracy: true,
  maximumAge: 0,
  timeout: 10000
});
</script>

</body>
</html>
