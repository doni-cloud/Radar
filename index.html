<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar Beta Teste</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

/* Área do mapa (simulada) */
#map {
  width: 100%;
  height: 100%;
  background: #e9ecef;
  position: relative;
}

/* Jeep + seta */
#veiculo {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 90px;
  height: 90px;
  transform: translate(-50%, -50%) rotate(0deg);
  transition: transform 0.2s linear;
  z-index: 10;
}

/* Placa de velocidade */
#placa {
  position: absolute;
  top: 16px;
  left: 16px;
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: #fff;
  border: 8px solid red;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 34px;
  font-weight: bold;
  color: #000;
  z-index: 20;
}

/* Velocidade atual */
#velocidade {
  position: absolute;
  top: 120px;
  left: 16px;
  background: #2b2b2b;
  color: #fff;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 16px;
  z-index: 20;
}
</style>
</head>

<body>

<div id="map">

  <!-- Jeep + seta (SVG embutido, sem bug) -->
  <svg id="veiculo" viewBox="0 0 100 100">
    <!-- Seta -->
    <polygon points="50,0 65,30 55,30 55,80 45,80 45,30 35,30"
             fill="#00aaff"/>
    <!-- Jeep -->
    <rect x="25" y="55" width="50" height="25" rx="6" fill="#111"/>
    <rect x="30" y="50" width="40" height="12" rx="4" fill="#222"/>
    <circle cx="35" cy="85" r="6" fill="#000"/>
    <circle cx="65" cy="85" r="6" fill="#000"/>
  </svg>

  <!-- Placa -->
  <div id="placa">50</div>

  <!-- Velocidade -->
  <div id="velocidade">0 km/h</div>

</div>

<script>
let angulo = 0;
let velocidadeAtual = 0;

// Limites simulando radar / tipo de via
const limitesVia = [50, 60, 80, 100, 110];
let indiceLimite = 0;

const veiculo = document.getElementById("veiculo");
const placa = document.getElementById("placa");
const velocidade = document.getElementById("velocidade");

// Simula movimento e rotação
setInterval(() => {
  angulo += 6;
  veiculo.style.transform =
    `translate(-50%, -50%) rotate(${angulo}deg)`;

  velocidadeAtual = Math.floor(Math.random() * 120);
  velocidade.innerText = velocidadeAtual + " km/h";

  // Alerta visual se passar do limite
  if (velocidadeAtual > limitesVia[indiceLimite]) {
    placa.style.background = "#ffe5e5";
  } else {
    placa.style.background = "#ffffff";
  }

}, 700);

// Simula troca de radar / via
setInterval(() => {
  indiceLimite = (indiceLimite + 1) % limitesVia.length;
  placa.innerText = limitesVia[indiceLimite];
}, 4000);
</script>

</body>
</html>
