
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>GPS Jeep Renegade – Beta 3 Estável</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
  margin: 0;
  height: 100%;
  background: #111;
}

#map {
  width: 100%;
  height: 100%;
}

/* LIMITE */
#limitBox {
  position: absolute;
  top: 12px;
  left: 12px;
  width: 78px;
  height: 78px;
  border-radius: 50%;
  border: 6px solid red;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  font-weight: bold;
  z-index: 1000;
}

/* VELOCIDADE */
#speedBox {
  position: absolute;
  top: 100px;
  left: 22px;
  background: #111;
  color: white;
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 18px;
  z-index: 1000;
}

/* CAMERA */
#freeCam {
  position: absolute;
  right: 16px;
  bottom: 20px;
  width: 56px;
  height: 56px;
  background: red;
  color: white;
  border-radius: 50%;
  font-size: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  cursor: pointer;
}

/* CONFIG */
#configBtn {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 44px;
  height: 44px;
  background: #222;
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1200;
  cursor: pointer;
}

/* MENU */
#configMenu {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.85);
  z-index: 2000;
  display: none;
  padding: 20px;
  color: white;
}

.configCard {
  background: #2a2a2a;
  border-radius: 14px;
  padding: 18px;
  margin-top: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.btn {
  padding: 10px 18px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  color: white;
}

.btn-green { background: green; }
.btn-red { background: red; }
.btn-gray { background: #555; }

#backBtn {
  width: 100%;
  margin-top: 26px;
  background: #444;
}
</style>
</head>

<body>

<div id="map"></div>
<div id="limitBox">50</div>
<div id="speedBox">0 km/h</div>
<div id="freeCam">📷</div>
<div id="configBtn">⚙️</div>

<!-- MENU -->
<div id="configMenu">
  <h1>Configurações</h1>

  <div class="configCard">
    <span>Som do Radar</span>
    <button id="soundToggle" class="btn btn-green">ATIVADO</button>
  </div>

  <div class="configCard">
    <span>Testar Bip</span>
    <button id="testSound" class="btn btn-gray">TESTAR</button>
  </div>

  <button id="backBtn" class="btn">Voltar</button>
</div>

let jeepMarker = null;

const jeepIcon = L.icon({
  iconUrl: jeepBase64,
  iconSize: [52, 52],
  iconAnchor: [26, 26]
});
  
/* MAPA */
const map = L.map('map', { zoomControl: false }).setView([0,0], 18);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

/* CAMERA */
let followGPS = true;
freeCam.onclick = () => {
  followGPS = !followGPS;
  freeCam.style.background = followGPS ? "red" : "green";
};

/* MENU */
configBtn.onclick = () => configMenu.style.display = "block";
backBtn.onclick = () => configMenu.style.display = "none";

/* SOM REAL (FUNCIONA NO ANDROID) */
let soundEnabled = true;
let audioCtx = null;

function playBeep(){
  if(!soundEnabled) return;
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.frequency.value = 950;
  gain.gain.value = 0.2;

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime + 0.18);
}

soundToggle.onclick = () => {
  soundEnabled = !soundEnabled;
  soundToggle.textContent = soundEnabled ? "ATIVADO" : "DESATIVADO";
  soundToggle.className = "btn " + (soundEnabled ? "btn-green" : "btn-red");
};

testSound.onclick = () => playBeep();

/* GPS */
navigator.geolocation.watchPosition(pos => {
  const lat = pos.coords.latitude;
  const lng = pos.coords.longitude;
  const speed = pos.coords.speed ? pos.coords.speed * 3.6 : 0;

  speedBox.innerText = Math.round(speed) + " km/h";
  
  if (jeepMarker) {
    jeepMarker.setLatLng([lat, lng]);
  } else {
    jeepMarker = L.marker([lat, lng], {
      icon: jeepIcon,
      interactive: false
    }).addTo(map);
  }

  if(followGPS) map.setView([lat,lng], map.getZoom(), { animate:false });

}, err => alert(err.message), { enableHighAccuracy:true });
</script>
