<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>GPS Jeep Renegade – Beta 3 Final</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
  margin: 0;
  height: 100%;
  background: #111;
}

#map {
  width: 100%;
  height: 100%;
}

/* LIMITE DA VIA */
#limitBox {
  position: absolute;
  top: 12px;
  left: 12px;
  width: 78px;
  height: 78px;
  border-radius: 50%;
  border: 6px solid red;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  font-weight: bold;
  z-index: 1000;
}

/* VELOCIDADE */
#speedBox {
  position: absolute;
  top: 100px;
  left: 22px;
  background: #111;
  color: white;
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 18px;
  z-index: 1000;
}

/* BOTÃO CÂMERA */
#freeCam {
  position: absolute;
  right: 16px;
  bottom: 20px;
  width: 56px;
  height: 56px;
  background: red;
  color: white;
  border-radius: 50%;
  font-size: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  cursor: pointer;
}

/* BOTÃO CONFIG */
#configBtn {
  position:absolute;
  top:12px;
  right:12px;
  width:46px;
  height:46px;
  background:#000;
  color:white;
  border-radius:50%;
  font-size:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1000;
  cursor:pointer;
}

/* MENU CONFIG */
#soundMenu {
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.85);
  color:white;
  z-index:2000;
  display:none;
  padding:20px;
}

#soundMenu button {
  padding:12px;
  font-size:16px;
  margin-top:12px;
}

/* FUMAÇA */
@keyframes smoke {
  from { opacity: 0.6; transform: translate(0,0) scale(1); }
  to   { opacity: 0; transform: translate(-12px,12px) scale(1.7); }
}
.smoke {
  position: absolute;
  width: 10px;
  height: 10px;
  background: rgba(200,200,200,0.6);
  border-radius: 50%;
  animation: smoke 1s linear infinite;
}
</style>
</head>

<body>

<div id="map"></div>
<div id="limitBox">50</div>
<div id="speedBox">0 km/h</div>
<div id="freeCam">📷</div>
<div id="configBtn">⚙️</div>

<!-- MENU SOM -->
<div id="soundMenu">
  <button onclick="closeSoundMenu()">⬅ Voltar</button>
  <h2>Som</h2>
  <button onclick="testBeep()">🔊 Testar Bip</button>
  <span id="soundStatus" style="margin-left:12px;color:#0f0">INATIVO</span>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* MAPA */
const map = L.map('map', { zoomControl: false }).setView([0,0], 18);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

/* CONFIG */
let followGPS = true;
let speedLimit = 50;
let speedBuffer = [];
let jeepMarker = null;

/* ÍCONE JEEP */
const jeepIcon = L.divIcon({
  className: '',
  html: `
  <div style="position:relative;width:48px;height:70px;">
    <svg width="48" height="70" viewBox="0 0 48 70">
      <ellipse cx="24" cy="66" rx="16" ry="4" fill="rgba(0,0,0,0.45)"/>
      <rect x="8" y="10" width="32" height="42" rx="9" fill="#0b0b0b"/>
      <circle cx="14" cy="46" r="3.2" fill="#ff2a2a"/>
      <circle cx="34" cy="46" r="3.2" fill="#ff2a2a"/>
    </svg>
    <div class="smoke" style="left:10px;bottom:4px"></div>
    <div class="smoke" style="right:10px;bottom:4px;animation-delay:.3s"></div>
  </div>`,
  iconSize: [48,70],
  iconAnchor: [24,35]
});

/* CÂMERA */
freeCam.onclick = () => {
  followGPS = !followGPS;
  freeCam.style.background = followGPS ? "red" : "green";
};

/* CONFIG MENU */
configBtn.onclick = () => {
  soundMenu.style.display = "block";
};
function closeSoundMenu(){
  soundMenu.style.display = "none";
}

/* SOM BIP (SEM MP3) */
let audioCtx = null;
function testBeep(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "square";
  osc.frequency.value = 1000;
  gain.gain.value = 0.2;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  setTimeout(()=>osc.stop(),200);
  soundStatus.innerText = "ATIVO";
}

/* GPS */
navigator.geolocation.watchPosition(pos => {
  const lat = pos.coords.latitude;
  const lng = pos.coords.longitude;
  const rawSpeed = pos.coords.speed ? pos.coords.speed * 3.6 : 0;

  speedBuffer.push(rawSpeed);
  if (speedBuffer.length > 6) speedBuffer.shift();
  const speed = speedBuffer.reduce((a,b)=>a+b,0) / speedBuffer.length;

  speedBox.innerText = Math.round(speed) + " km/h";
  limitBox.style.background = speed > speedLimit ? "red" : "white";
  limitBox.style.color = speed > speedLimit ? "white" : "black";

  if (jeepMarker) map.removeLayer(jeepMarker);
  jeepMarker = L.marker([lat,lng], { icon: jeepIcon }).addTo(map);

  if (followGPS) map.setView([lat,lng], map.getZoom(), { animate:false });

}, err => alert("Erro GPS: " + err.message), {
  enableHighAccuracy:true,
  timeout:10000
});
</script>

</body>
</html>
