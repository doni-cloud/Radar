<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Jeep Navigation Beta 3</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #111;
  font-family: Arial, sans-serif;
}

#map {
  height: 100%;
  width: 100%;
}

/* HUD */
#hud {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 999;
  color: #fff;
}

.box {
  background: rgba(0,0,0,0.7);
  padding: 8px 12px;
  border-radius: 10px;
  margin-bottom: 6px;
  font-size: 16px;
}

#limit {
  font-size: 28px;
  font-weight: bold;
  border: 6px solid red;
  border-radius: 50%;
  width: 70px;
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fff;
  color: #000;
}

/* Camera button */
#cameraBtn {
  position: absolute;
  bottom: 20px;
  right: 20px;
  z-index: 999;
  background: red;
  color: white;
  padding: 14px;
  border-radius: 50%;
  font-size: 20px;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="hud">
  <div id="limit">50</div>
  <div class="box" id="speed">0 km/h</div>
</div>

<div id="cameraBtn">📷</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// ===== MAPA =====
const map = L.map('map', { zoomControl: false }).setView([-23.55, -46.63], 17);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

// ===== ICONES =====
const jeepIcon = L.icon({
  iconUrl: 'https://cdn-icons-png.flaticon.com/512/744/744465.png',
  iconSize: [48,48],
  iconAnchor: [24,24]
});

const radarIcon = L.icon({
  iconUrl: 'https://cdn-icons-png.flaticon.com/512/484/484613.png',
  iconSize: [36,36]
});

const semaforoIcon = L.icon({
  iconUrl: 'https://cdn-icons-png.flaticon.com/512/484/484167.png',
  iconSize: [36,36]
});

// ===== MARCADORES =====
const jeep = L.marker([-23.55, -46.63], {
  icon: jeepIcon,
  rotationAngle: 0
}).addTo(map);

L.marker([-23.551, -46.632], { icon: radarIcon }).addTo(map);
L.marker([-23.549, -46.631], { icon: semaforoIcon }).addTo(map);

// ===== VARIÁVEIS =====
let lastPos = null;
let cameraLock = true;
let speedLimit = 50;

// ===== CAMERA =====
document.getElementById('cameraBtn').onclick = () => {
  cameraLock = !cameraLock;
  document.getElementById('cameraBtn').style.background =
    cameraLock ? 'red' : 'green';
};

// ===== GPS REAL =====
navigator.geolocation.watchPosition(pos => {
  const lat = pos.coords.latitude;
  const lon = pos.coords.longitude;
  const speed = pos.coords.speed ? pos.coords.speed * 3.6 : 0;
  const heading = pos.coords.heading || 0;

  jeep.setLatLng([lat, lon]);
  jeep.setRotationAngle(heading);

  if (cameraLock) {
    map.setView([lat, lon], map.getZoom(), { animate: true });
  }

  document.getElementById('speed').innerText =
    speed.toFixed(0) + ' km/h';

  // ===== LIMITE SIMPLES =====
  speedLimit = speed > 80 ? 110 : speed > 60 ? 80 : 50;
  document.getElementById('limit').innerText = speedLimit;

  if (speed > speedLimit) {
    document.body.style.background = '#400';
  } else {
    document.body.style.background = '#111';
  }

}, err => {
  alert('Ative o GPS');
}, {
  enableHighAccuracy: true,
  maximumAge: 0
});
</script>

</body>
</html>
