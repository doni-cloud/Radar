<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>GPS Radar – BETA 02 (Estável)</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

#map {
  width: 100%;
  height: 100%;
}

/* SETA */
.seta-container svg {
  width: 50px;
  height: 50px;
  transform-origin: 50% 50%;
  transition: transform 0.2s linear;
}

/* PLACA VELOCIDADE */
#speedBox {
  position: fixed;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 90px;
  height: 90px;
  background: white;
  border: 5px solid red;
  border-radius: 50%;
  text-align: center;
  font-family: Arial, sans-serif;
  z-index: 9999;
}

#speedValue {
  font-size: 32px;
  font-weight: bold;
  margin-top: 18px;
}

/* CONFIG */
#configBtn {
  position: fixed;
  top: 12px;
  right: 12px;
  width: 44px;
  height: 44px;
  background: rgba(0,0,0,0.7);
  color: white;
  border-radius: 50%;
  font-size: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  cursor: pointer;
}

#configMenu {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  color: white;
  display: none;
  z-index: 10000;
}

#closeConfig {
  position: absolute;
  top: 15px;
  right: 15px;
  font-size: 26px;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="speedBox">
  <div id="speedValue">0</div>
  <div style="font-size:14px;">km/h</div>
</div>

<div id="configBtn">⚙️</div>

<div id="configMenu">
  <div id="closeConfig">✖</div>
  <h2 style="margin:20px;">Configurações</h2>
  <p style="margin:20px;">(Menu funcional – opções entram no BETA 03)</p>
</div>

}).addTo(map);

  `,
  iconSize: [50,50],
  iconAnchor: [25,25]
});

const marcador = L.marker([0,0], { icon: setaIcon }).addTo(map);
