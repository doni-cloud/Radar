<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>GPS Radar Beta</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

/* MAPA */
#map {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #111;
}

/* SETA */
#arrow {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  border-left: 18px solid transparent;
  border-right: 18px solid transparent;
  border-bottom: 40px solid #00ffcc;
  transform: translate(-50%, -50%) rotate(0deg);
  transition: transform 0.2s linear;
}

/* VELOCIDADE */
#speedBox {
  position: fixed;
  left: 10px;
  top: 40%;
  background: rgba(0,0,0,0.7);
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 22px;
  font-weight: bold;
}

/* CONFIG */
#configBtn {
  position: fixed;
  top: 10px;
  right: 10px;
  font-size: 26px;
  cursor: pointer;
}

/* MENU */
#menu {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  display: none;
  padding: 20px;
}

select {
  width: 100%;
  padding: 10px;
  font-size: 16px;
}
</style>
</head>

<body>

<div id="map">
  <div id="arrow"></div>
</div>

<div id="speedBox">0 km/h</div>
<div id="configBtn">⚙️</div>

<div id="menu">
  <h2>Configurações</h2>
  <label>Voz do alerta:</label><br><br>
  <select id="voiceSelect"></select><br><br>
  <button onclick="closeMenu()">Fechar</button>
</div>

<script>
let arrow = document.getElementById("arrow");
let speedBox = document.getElementById("speedBox");
let voices = [];
let selectedVoice = null;

/* VOZ */
function loadVoices() {
  voices = speechSynthesis.getVoices();
  let select = document.getElementById("voiceSelect");
  select.innerHTML = "";

  voices.forEach((v, i) => {
    if (v.lang.includes("pt")) {
      let opt = document.createElement("option");
      opt.value = i;
      opt.text = v.name + " (" + v.lang + ")";
      select.appendChild(opt);
    }
  });

  select.onchange = () => {
    selectedVoice = voices[select.value];
  };

  if (voices.length > 0) {
    selectedVoice = voices[0];
  }
}

speechSynthesis.onvoiceschanged = loadVoices;

/* ALERTA TESTE */
function speak(text) {
  let u = new SpeechSynthesisUtterance(text);
  if (selectedVoice) u.voice = selectedVoice;
  u.lang = "pt-BR";
  speechSynthesis.speak(u);
}

/* MENU */
document.getElementById("configBtn").onclick = () => {
  document.getElementById("menu").style.display = "block";
};

function closeMenu() {
  document.getElementById("menu").style.display = "none";
}

/* GPS */
if (navigator.geolocation) {
  navigator.geolocation.watchPosition(pos => {
    let speed = pos.coords.speed;
    let heading = pos.coords.heading;

    if (speed !== null) {
      let kmh = Math.max(0, speed * 3.6).toFixed(0);
      speedBox.innerText = kmh + " km/h";
    }

    if (heading !== null) {
      arrow.style.transform =
        "translate(-50%, -50%) rotate(" + heading + "deg)";
    }
  }, err => {
    alert("Erro GPS: " + err.message);
  }, {
    enableHighAccuracy: true,
    maximumAge: 0,
    timeout: 5000
  });
}

/* TESTE DE VOZ AUTOMÁTICO */
setTimeout(() => {
  speak("Sistema de alerta ativo");
}, 2000);
</script>

</body>
</html>
